 "A comma alone can't join two complete sentences. That's a comma splice.", "With no punctuation, the two sentences run together.", "\"Because he trusted God completely\" isn't a complete sentence, so it can't follow a semicolon."], ""], ["Punctuation", "Pack three things for [camp:] cleats, shin guards, and a water bottle.", ["NO CHANGE", "camp;", "camp,", "camp, such as:"], 0, "A colon can introduce a list after a complete sentence. \"Pack three things for camp\" is complete.", ["", "A semicolon must join two complete sentences, and the list isn't one.", "A comma makes it look like \"camp\" is the first item in the list.", "Don't use a colon right after \"such as.\" The phrase already introduces the list."], ""], ["Punctuation", "The team's three captains [are:] Maya, Jordan, and Eli.", ["NO CHANGE", "are", "are;", "are,"], 1, "Don't put a colon right after a verb. A colon needs a complete sentence before it.", ["\"The team's three captains are\" isn't a complete sentence, so it can't come before a colon.", "", "A semicolon can't separate a verb from what follows it.", "A comma can't separate the verb from the names that complete it."], ""], ["Punctuation", "The game was tied at [halftime] but our defense held strong.", ["NO CHANGE", "halftime,", "halftime;", "halftime:"], 1, "When \"but\" joins two complete sentences, put a comma before it.", ["Two complete sentences joined by \"but\" need a comma before \"but.\"", "", "Don't use a semicolon before \"but\" here. A comma goes with a conjunction.", "A colon doesn't fit. What follows doesn't explain \"halftime.\""], ""], ["Punctuation", "After the final whistle [blew] the players knelt to pray.", ["NO CHANGE", "blew,", "blew;", "blew."], 1, "Put a comma after an introductory clause like \"After the final whistle blew.\"", ["Without a comma, the opening clause runs into the main sentence.", "", "\"After the final whistle blew\" can't stand alone, so a semicolon doesn't work.", "A period leaves \"After the final whistle blew.\" as a fragment."], ""], ["Punctuation", "Maya wore her [bright, red,] jersey to the final.", ["NO CHANGE", "bright red", "bright, red", "bright; red"], 1, "\"Bright\" describes the shade of red, not the jersey separately, so no commas are needed. Never put a comma between the last describing word and the noun.", ["The comma after \"red\" separates the describing words from the noun, which is never correct.", "", "\"Bright\" modifies \"red,\" so a comma between them breaks up the phrase.", "A semicolon can't go between describing words."], ""], ["Punctuation", "The trophy [ —] polished and gleaming — sat on the coach's desk.", ["NO CHANGE", ",", ";", "no punctuation"], 0, "The extra phrase closes with a dash, so it must open with a dash too.", ["", "The marks must match. A comma can't open a phrase that a dash closes.", "A semicolon can't set off an extra phrase.", "Without an opening mark, the closing dash has nothing to pair with."], ""], ["Punctuation", "The player [whose] jersey was retired thanked his coaches.", ["NO CHANGE", "who's", "who", "whom"], 0, "\"Whose\" shows ownership: the jersey belongs to the player.", ["", "\"Who's\" means \"who is\": \"the player who is jersey\" makes no sense.", "\"Who\" doesn't show ownership.", "\"Whom\" is an object pronoun and doesn't show ownership."], ""], ["Punctuation", "The fans raised [there] voices in song.", ["NO CHANGE", "their", "they're", "there's"], 1, "\"Their\" shows ownership: the voices belong to the fans.", ["\"There\" refers to a place, not ownership.", "", "\"They're\" means \"they are.\"", "\"There's\" means \"there is.\""], ""], ["Punctuation", "Both [coaches] offices are near the gym.", ["NO CHANGE", "coach's", "coaches'", "coaches's"], 2, "There are two coaches (\"Both\"), and the offices belong to them, so use the plural possessive: coaches'.", ["\"Coaches\" with no apostrophe doesn't show ownership.", "\"Coach's\" means one coach, but the sentence says \"Both.\"", "", "\"Coaches's\" is never correct."], ""], ["Punctuation", "The forecast called for [rain. However,] the game went on.", ["NO CHANGE", "rain, however,", "rain; however", "rain however"], 0, "\"However\" can start a new sentence, followed by a comma. That's what the original does.", ["", "A comma before \"however\" can't join two complete sentences. That's a comma splice.", "With a semicolon, \"however\" still needs a comma after it.", "With no punctuation, the two sentences run together."], ""], ["Punctuation", "The coach [explained,] that effort matters more than talent.", ["NO CHANGE", "explained", "explained:", "explained;"], 1, "Don't put a comma between a verb and the \"that\" clause that completes it.", ["The comma separates \"explained\" from what was explained.", "", "A colon needs a complete sentence before it, and it never goes before \"that.\"", "A semicolon needs complete sentences on both sides."], ""], ["Punctuation", "The British [author, C.S. Lewis,] wrote The Chronicles of Narnia.", ["NO CHANGE", "author C.S. Lewis", "author, C.S. Lewis", "author C.S. Lewis,"], 1, "There are many British authors, so the name tells us which one. Essential information like this gets no commas.", ["The commas treat the name as extra information, but it's needed to tell which author.", "", "The commas don't match: one opens, and nothing closes.", "The comma splits the subject from its verb, \"wrote.\""], ""], ["Punctuation", "The [childrens'] choir sang first on Easter morning.", ["NO CHANGE", "children's", "childrens", "childs'"], 1, "\"Children\" is already plural, so add 's to make it possessive: children's.", ["\"Childrens'\" isn't a word. \"Children\" is already plural.", "", "\"Childrens\" isn't a word, and it doesn't show ownership.", "\"Childs'\" isn't a word."], ""], ["Punctuation", "My brother, a goalkeeper for his club [team] practices every morning.", ["NO CHANGE", "team,", "team;", "team —"], 1, "The extra phrase \"a goalkeeper for his club team\" opens with a comma, so it must close with one.", ["The phrase never closes, so the subject runs into the verb.", "", "A semicolon can't close an extra phrase.", "A comma opened the phrase, so a comma must close it."], ""], ["Punctuation", "We stayed late after [practice;] because the coach asked us to help.", ["NO CHANGE", "practice", "practice.", "practice:"], 1, "\"Because the coach asked us to help\" depends on the main clause. Usually no punctuation is needed before a \"because\" clause at the end.", ["A semicolon can't come before a clause that can't stand alone.", "", "A period leaves \"Because the coach asked us to help.\" as a fragment.", "A colon doesn't fit. It needs a list or an explanation after a complete sentence."], ""], ["Sentence Structure", "Joseph forgave his [brothers, he] knew God had a plan.", ["NO CHANGE", "brothers. He", "brothers he", "brothers, and since he"], 1, "These are two complete sentences. A period correctly separates them.", ["A comma alone can't join two complete sentences. That's a comma splice.", "", "With no punctuation, the sentences run together.", "\"And since he knew God had a plan\" leaves the second part without a main clause."], ""], ["Sentence Structure", "The team trained all [summer. Hoping] to win the state title.", ["NO CHANGE", "summer, hoping", "summer; hoping", "summer. Hoping that"], 1, "\"Hoping to win the state title\" can't stand alone. Attach it with a comma.", ["\"Hoping to win the state title.\" is a fragment. It has no subject or main verb.", "", "A semicolon needs complete sentences on both sides.", "\"Hoping that to win...\" is still a fragment, and it's ungrammatical."], ""], ["Sentence Structure", "[Running down the sideline, the ball was kicked by Eli] into the goal.", ["NO CHANGE", "Running down the sideline, Eli kicked the ball", "Eli was running down the sideline, the ball was kicked", "While running down the sideline, the ball was kicked by Eli"], 1, "The opening phrase describes whoever comes right after the comma. Eli was running, not the ball, so \"Eli\" must come right after the comma.", ["This says the ball was running down the sideline. That's a dangling modifier.", "", "This joins two complete sentences with only a comma. That's a comma splice.", "Adding \"While\" doesn't fix it. The ball still seems to be running."], ""], ["Sentence Structure", "Coach told us to stretch, hydrate, and [that we should get] enough sleep.", ["NO CHANGE", "get", "getting", "we should get"], 1, "Items in a list should match in form: stretch, hydrate, and get.", ["\"That we should get\" breaks the pattern of simple verbs.", "", "\"Getting\" doesn't match \"stretch\" and \"hydrate.\"", "\"We should get\" doesn't match the pattern."], ""], ["Sentence Structure", "Ruth was loyal, humble, and [she worked hard].", ["NO CHANGE", "hardworking", "working hard", "she was a hard worker"], 1, "The list uses describing words (loyal, humble), so the last item should be one too: hardworking.", ["\"She worked hard\" is a whole clause, not a describing word like the others.", "", "\"Working hard\" is a verb phrase, not an adjective like \"loyal\" and \"humble.\"", "This is a whole clause, which breaks the pattern."], ""], ["Sentence Structure", "The bus was [late we] missed warmups.", ["NO CHANGE", "late, we", "late, so we", "late so, we"], 2, "Two complete sentences need a comma plus a conjunction, like \"so,\" or a period or semicolon.", ["Two complete sentences run together with nothing between them.", "A comma alone can't join two complete sentences.", "", "The comma belongs before \"so,\" not after it."], ""], ["Sentence Structure", "We lost the final [2–1. Which] was hard to accept.", ["NO CHANGE", "2–1, which", "2–1; which", "2–1. That which"], 1, "\"Which was hard to accept\" can't stand alone. Attach it with a comma.", ["\"Which was hard to accept.\" is a fragment.", "", "A semicolon needs complete sentences on both sides.", "\"That which was hard to accept.\" is still a fragment."], ""], ["Sentence Structure", "Having finished his homework, [the Bible was the next thing Sam opened.]", ["NO CHANGE", "Sam opened his Bible next.", "the next thing opened by Sam was the Bible.", "Sam's Bible was opened next."], 1, "The person who finished his homework is Sam, so \"Sam\" must come right after the comma.", ["This says the Bible finished the homework.", "", "This says \"the next thing\" finished the homework.", "This says Sam's Bible finished the homework."], ""], ["Sentence Structure", "Although the team practiced in the [rain. They] stayed positive.", ["NO CHANGE", "rain, they", "rain; they", "rain, and they"], 1, "\"Although the team practiced in the rain\" can't stand alone. Join it to the main clause with a comma.", ["\"Although the team practiced in the rain.\" is a fragment.", "", "A semicolon can't follow a clause that can't stand alone.", "With \"Although\" plus \"and,\" the sentence has no main clause."], ""], ["Sentence Structure", "Running sprints is harder than [to lift] weights.", ["NO CHANGE", "lifting", "you lift", "the lifting of"], 1, "Compare things in the same form: running and lifting.", ["\"To lift\" doesn't match \"running.\"", "", "\"You lift\" doesn't match \"running sprints.\"", "\"The lifting of weights\" is wordy and doesn't match \"running sprints.\""], ""], ["Sentence Structure", "We were [tired, however,] we kept running.", ["NO CHANGE", "tired; however,", "tired however", "tired, however"], 1, "Two complete sentences joined by \"however\" need a semicolon before it and a comma after.", ["A comma before \"however\" creates a comma splice.", "", "With no punctuation, the sentences run together.", "This is still a comma splice."], ""], ["Sentence Structure", "Paul wrote many [letters. Paul wrote them] to early churches.", ["NO CHANGE", "letters", "letters, writing them", "letters; he wrote them"], 1, "\"Paul wrote many letters to early churches\" says the same thing in the fewest words. On the ACT, shorter is usually better when the meaning is the same.", ["This repeats \"Paul wrote\" for no reason.", "", "\"Writing them\" adds extra words without adding meaning.", "This is grammatical, but it repeats the idea. The ACT prefers concise."], "Which choice most effectively combines the sentences at the underlined portion?"], ["Sentence Structure", "The fans [cheering] loudly as the team took the field.", ["NO CHANGE", "cheered", "who cheered", "having cheered"], 1, "The sentence needs a main verb: \"The fans cheered.\"", ["\"Cheering\" isn't a main verb on its own, so the sentence is a fragment.", "", "\"The fans who cheered loudly...\" never says what the fans did. It's a fragment.", "\"Having cheered\" isn't a main verb either."], ""], ["Sentence Structure", "He [only scored] in the second half.", ["NO CHANGE", "scored only", "scored, only", "only, scored"], 1, "Put \"only\" right before what it limits. He scored only in the second half, not \"only scored\" as opposed to doing something else.", ["\"Only scored\" suggests scoring was the only thing he did.", "", "A comma here breaks up the sentence for no reason.", "A comma after \"only\" is incorrect."], ""], ["Sentence Structure", "Daily prayer not only calms the mind [but also it strengthens] the heart.", ["NO CHANGE", "but also strengthens", "but it also strengthens", "and also strengthens"], 1, "\"Not only calms\" must be matched by \"but also strengthens.\" Keep the same form on both sides.", ["Adding \"it\" breaks the parallel pattern.", "", "\"But it also strengthens\" doesn't match \"not only calms.\"", "\"Not only\" must pair with \"but also,\" not \"and also.\""], ""], ["Sentence Structure", "Because the referee missed the [foul. The] crowd groaned.", ["NO CHANGE", "foul, the", "foul; the", "foul, and the"], 1, "\"Because the referee missed the foul\" can't stand alone. Join it to the main clause with a comma.", ["\"Because the referee missed the foul.\" is a fragment.", "", "A semicolon can't follow a clause that can't stand alone.", "\"Because ... and the crowd groaned\" leaves no main clause."], ""], ["Sentence Structure", "After losing the game, [the bus was quiet on the ride home.]", ["NO CHANGE", "the players rode home quietly.", "the ride home was quiet.", "it was a quiet bus ride home."], 1, "The players lost the game, so \"the players\" must come right after the comma.", ["This says the bus lost the game.", "", "This says the ride lost the game.", "\"It\" didn't lose the game. The players did."], ""], ["Sentence Structure", "The camp focuses on passing, shooting, and [how to defend].", ["NO CHANGE", "defending", "to defend", "defense skills that are taught"], 1, "Keep the list in the same form: passing, shooting, defending.", ["\"How to defend\" breaks the pattern of -ing words.", "", "\"To defend\" doesn't match \"passing\" and \"shooting.\"", "This is wordy and breaks the pattern."], ""], ["Sentence Structure", "Jesus calmed the [storm, the] disciples were amazed.", ["NO CHANGE", "storm, and the", "storm the", "storm, so that the"], 1, "Two complete sentences need a comma plus a conjunction, like \"and.\"", ["A comma alone can't join two complete sentences.", "", "With no punctuation, the sentences run together.", "\"So that\" means Jesus calmed the storm in order to amaze them, which changes the meaning."], ""], ["Sentence Structure", "Bring your [gear. Such as] cleats and a water bottle.", ["NO CHANGE", "gear, such as", "gear; such as", "gear. For example"], 1, "\"Such as cleats and a water bottle\" can't stand alone. Attach it with a comma.", ["\"Such as cleats and a water bottle.\" is a fragment.", "", "A semicolon needs complete sentences on both sides.", "\"For example cleats and a water bottle.\" is still a fragment."], ""], ["Grammar & Usage", "The box of new soccer balls [are] in the closet.", ["NO CHANGE", "is", "were", "have been"], 1, "The subject is \"box,\" which is singular. \"Of new soccer balls\" is just a describing phrase. Cross it out to find the real subject.", ["\"Are\" agrees with \"balls,\" but the subject is \"box.\"", "", "\"Were\" is plural and changes the tense.", "\"Have been\" is plural."], ""], ["Grammar & Usage", "Each of the players [have] a water bottle.", ["NO CHANGE", "has", "are having", "have had"], 1, "\"Each\" is singular, so it takes \"has.\"", ["\"Have\" is plural, but \"each\" is singular.", "", "\"Are having\" is plural and awkward.", "\"Have had\" is plural."], ""], ["Grammar & Usage", "Coach gave the award to Maya and [I].", ["NO CHANGE", "me", "myself", "mine"], 1, "After \"to,\" use the object form: me. Test it by dropping \"Maya and\": \"gave the award to me.\"", ["You wouldn't say \"gave the award to I.\"", "", "\"Myself\" is only used when the subject is also \"I.\"", "\"Mine\" shows ownership."], ""], ["Grammar & Usage", "The team celebrated [their] first win of the season.", ["NO CHANGE", "its", "it's", "they're"], 1, "\"The team\" is one group, so the ACT treats it as singular: its.", ["\"Their\" is plural, but \"team\" is singular here.", "", "\"It's\" means \"it is.\"", "\"They're\" means \"they are.\""], ""], ["Grammar & Usage", "The coach, [who] the players admired, retired after thirty years.", ["NO CHANGE", "whom", "which", "whose"], 1, "The players admired him, so use the object form: whom. Quick test: if \"him\" fits, use \"whom.\"", ["\"Who\" is for subjects (he), but here the coach is the object of \"admired\" (him).", "", "\"Which\" is for things, not people.", "\"Whose\" shows ownership."], ""], ["Grammar & Usage", "Yesterday, the team [runs] five miles before breakfast.", ["NO CHANGE", "ran", "has run", "will run"], 1, "\"Yesterday\" means the past tense: ran.", ["\"Runs\" is present tense, but \"Yesterday\" points to the past.", "", "\"Has run\" doesn't fit a specific past time like \"yesterday.\"", "\"Will run\" is future tense."], ""], ["Grammar & Usage", "By the time the bus arrived, the game [already started].", ["NO CHANGE", "had already started", "has already started", "already starting"], 1, "The game started before the bus arrived. For the earlier of two past events, use \"had\" plus the verb.", ["Without \"had,\" it's unclear which happened first.", "", "\"Has\" is present perfect and doesn't match \"arrived.\"", "\"Already starting\" isn't a complete verb."], ""], ["Grammar & Usage", "Of the two goalkeepers, Sam is the [best].", ["NO CHANGE", "better", "more better", "most good"], 1, "When comparing two, use \"better.\" Save \"best\" for three or more.", ["\"Best\" is for three or more. There are only two goalkeepers.", "", "\"More better\" doubles the comparison, which is never correct.", "\"Most good\" is incorrect, and it's for three or more."], ""], ["Grammar & Usage", "She played [good] in the final.", ["NO CHANGE", "well", "goodly", "more good"], 1, "\"Played\" is an action, so it needs an adverb: well.", ["\"Good\" is an adjective. It can't describe how someone played.", "", "\"Goodly\" doesn't mean \"in a good way.\"", "\"More good\" is incorrect."], ""], ["Grammar & Usage", "The coach was proud [for] her team.", ["NO CHANGE", "of", "at", "with"], 1, "The standard phrase is \"proud of.\"", ["\"Proud for\" isn't standard English.", "", "\"Proud at\" isn't standard English.", "\"Proud with\" isn't standard English."], ""], ["Grammar & Usage", "Lack of sleep can [effect] your reaction time.", ["NO CHANGE", "affect", "effects", "affected"], 1, "\"Affect\" is usually the verb (to influence). \"Effect\" is usually the noun (the result).", ["\"Effect\" as a verb means to bring about, which doesn't fit here.", "", "\"Effects\" is a noun or the wrong form after \"can.\"", "\"Can affected\" is the wrong verb form."], ""], ["Grammar & Usage", "The second half was faster [then] the first.", ["NO CHANGE", "than", "then that of", "compared to"], 1, "Use \"than\" for comparisons and \"then\" for time.", ["\"Then\" refers to time, not comparison.", "", "\"Then\" is still the wrong word.", "\"Faster compared to the first\" is wordy and awkward."], ""], ["Grammar & Usage", "We made [less] mistakes in the second half.", ["NO CHANGE", "fewer", "lesser", "littler"], 1, "Use \"fewer\" with things you can count (mistakes) and \"less\" with amounts (less time).", ["You can count mistakes, so use \"fewer.\"", "", "\"Lesser\" means lower in importance.", "\"Littler\" means smaller in size."], ""], ["Grammar & Usage", "There [is] three games left in the season.", ["NO CHANGE", "are", "was", "has been"], 1, "In a \"There is / There are\" sentence, the subject comes after the verb. \"Three games\" is plural, so use \"are.\"", ["\"Is\" is singular, but \"games\" is plural.", "", "\"Was\" is singular and past tense.", "\"Has been\" is singular."], ""], ["Grammar & Usage", "Faith and hope [gives] us strength in hard times.", ["NO CHANGE", "give", "has given", "is giving"], 1, "Two subjects joined by \"and\" are plural, so use \"give.\"", ["\"Gives\" is singular, but \"faith and hope\" are two things.", "", "\"Has given\" is singular.", "\"Is giving\" is singular."], ""], ["Grammar & Usage", "Neither the captain nor the players [was] ready for the rain.", ["NO CHANGE", "were", "is", "has been"], 1, "With \"neither...nor,\" the verb agrees with the closer subject: players, so \"were.\"", ["\"Was\" agrees with \"captain,\" but the verb follows the closer subject, \"players.\"", "", "\"Is\" is singular and present tense.", "\"Has been\" is singular."], ""], ["Grammar & Usage", "Between you and [I], the drill was exhausting.", ["NO CHANGE", "me", "myself", "mine"], 1, "After a preposition like \"between,\" use the object form: me.", ["\"I\" is a subject form. After \"between,\" use \"me.\"", "", "\"Myself\" needs \"I\" as the subject of the sentence.", "\"Mine\" shows ownership."], ""], ["Grammar & Usage", "Jordan and [myself] led the warmup.", ["NO CHANGE", "I", "me", "himself"], 1, "This is the subject of \"led,\" so use \"I.\" Test it: \"I led the warmup.\"", ["\"Myself\" can't be the subject.", "", "\"Me\" is an object form. \"Me led\" is wrong.", "\"Himself\" is reflexive, and it's the wrong person."], ""], ["Grammar & Usage", "The players have [went] to the field.", ["NO CHANGE", "gone", "goed", "going"], 1, "After \"have,\" use \"gone,\" not \"went.\"", ["\"Went\" is simple past. It never follows \"have.\"", "", "\"Goed\" isn't a word.", "\"Have going\" isn't a correct verb form."], ""], ["Grammar & Usage", "When Eli passed the ball to Sam, [he] scored from close range.", ["NO CHANGE", "Sam", "him", "they"], 1, "\"He\" could mean Eli or Sam. Naming Sam removes the confusion.", ["\"He\" is unclear. Did Eli or Sam score?", "", "\"Him\" is an object form and can't be the subject of \"scored.\"", "\"They\" is plural and still unclear."], ""], ["Grammar & Usage", "The [amount] of fans at the game set a school record.", ["NO CHANGE", "number", "amounts", "much"], 1, "Use \"number\" for things you can count, like fans. Use \"amount\" for things you can't count, like water.", ["You can count fans, so use \"number.\"", "", "\"Amounts\" is still for things you can't count.", "\"Much\" can't be used this way."], ""], ["Grammar & Usage", "If we had trained harder, we [would of] won.", ["NO CHANGE", "would have", "would had", "will have"], 1, "The correct phrase is \"would have.\" \"Would of\" comes from how \"would've\" sounds when spoken.", ["\"Would of\" is never correct.", "", "\"Would had\" is not a correct verb form.", "\"Will have\" is future tense, which doesn't fit \"If we had trained.\""], ""], ["Grammar & Usage", "One of the hymns [are] my grandmother's favorite.", ["NO CHANGE", "is", "were", "be"], 1, "The subject is \"One,\" which is singular. \"Of the hymns\" is a describing phrase.", ["\"Are\" agrees with \"hymns,\" but the subject is \"One.\"", "", "\"Were\" is plural.", "\"Be\" isn't the right form here."], ""], ["Grammar & Usage", "David picked up five smooth stones and [walks] toward Goliath.", ["NO CHANGE", "walked", "has walked", "walking"], 1, "Keep the tense consistent. \"Picked\" is past, so \"walked\" should be too.", ["\"Walks\" is present tense, but \"picked\" is past.", "", "\"Has walked\" doesn't match \"picked.\"", "\"Walking\" isn't a complete verb here."], ""], ["Grammar & Usage", "Neither of the teams [were] ready for overtime.", ["NO CHANGE", "was", "are", "have been"], 1, "\"Neither\" by itself is singular, so it takes \"was.\"", ["\"Were\" is plural, but \"neither\" is singular.", "", "\"Are\" is plural and present tense.", "\"Have been\" is plural."], ""], ["Style & Word Choice", "The team [returned back] to the locker room.", ["NO CHANGE", "returned", "returned back again", "went returning"], 1, "\"Return\" already means \"go back,\" so \"back\" is redundant.", ["\"Returned back\" says the same thing twice.", "", "This adds even more repetition.", "\"Went returning\" is awkward and wordy."], ""], ["Style & Word Choice", "At [6 a.m. in the morning], practice began.", ["NO CHANGE", "6 a.m.", "6 a.m. early in the morning", "six in the morning a.m."], 1, "\"A.m.\" already means morning, so \"in the morning\" is redundant.", ["\"A.m.\" and \"in the morning\" say the same thing.", "", "This repeats the idea even more.", "This is jumbled and redundant."], ""], ["Style & Word Choice", "[Due to the fact that] it rained, the game was delayed.", ["NO CHANGE", "Because", "Owing to the fact that", "In light of the fact that"], 1, "\"Because\" says the same thing in one word. The ACT rewards the shortest choice that keeps the meaning.", ["Wordy. \"Due to the fact that\" just means \"because.\"", "", "Just as wordy.", "Just as wordy."], ""], ["Style & Word Choice", "The coach [made the decision to cancel] practice.", ["NO CHANGE", "decided to cancel", "made a decision about deciding to cancel", "came to a decision that was to cancel"], 1, "\"Decided\" says it in one word instead of four.", ["\"Made the decision to\" is a wordy way to say \"decided to.\"", "", "This repeats \"decision\" and \"deciding.\"", "Very wordy and awkward."], ""], ["Style & Word Choice", "The two teams [shared in common] a long history.", ["NO CHANGE", "shared", "commonly shared in common", "had shared mutually"], 1, "\"Shared\" already means \"had in common.\"", ["\"Shared in common\" is redundant.", "", "This doubles the redundancy.", "\"Mutually\" repeats \"shared.\""], ""], ["Style & Word Choice", "Paul's letters, which were [super chill and] encouraging, strengthened the early church.", ["NO CHANGE", "warm and", "lowkey and", "totally"], 1, "Match the essay's formal tone. \"Warm\" fits. Slang doesn't.", ["\"Super chill\" is slang and doesn't match the formal tone.", "", "\"Lowkey\" is slang.", "\"Totally encouraging\" is too casual."], ""], ["Style & Word Choice", "The crowd's cheering was [incessant], continuing for the full ninety minutes.", ["NO CHANGE", "intermittent", "infrequent", "insistent"], 0, "\"Incessant\" means never stopping, which matches \"continuing for the full ninety minutes.\"", ["", "\"Intermittent\" means stopping and starting, which contradicts \"continuing.\"", "\"Infrequent\" means rare, which contradicts \"continuing.\"", "\"Insistent\" means demanding, which doesn't fit the description of time."], ""], ["Style & Word Choice", "[In my personal opinion, I think] the defense is our strength.", ["NO CHANGE", "I think", "In my opinion, I think", "Personally, in my opinion,"], 1, "\"I think\" already says it's your opinion. The other words repeat it.", ["\"In my personal opinion\" and \"I think\" say the same thing.", "", "This still repeats the idea.", "This repeats \"personal\" and \"opinion.\""], ""], ["Style & Word Choice", "Jesus fed [about five thousand people] with five loaves and two fish.", ["NO CHANGE", "about five thousand people, approximately", "around about five thousand people", "a crowd of people who numbered roughly about five thousand"], 0, "The original is clear and concise.", ["", "\"About\" and \"approximately\" mean the same thing.", "\"Around about\" is redundant.", "Wordy, and \"roughly about\" is redundant."], ""], ["Style & Word Choice", "Her coach [complemented] her footwork after the game.", ["NO CHANGE", "complimented", "complicated", "completed"], 1, "\"Compliment\" means to praise. \"Complement\" means to complete or go well with.", ["\"Complemented\" means went well with, not praised.", "", "\"Complicated\" means made harder.", "\"Completed\" means finished."], ""], ["Style & Word Choice", "[A goal was scored by Maya] in the first minute.", ["NO CHANGE", "Maya scored a goal", "A goal, by Maya, was scored", "Scored by Maya was a goal"], 1, "The active voice (\"Maya scored\") is clearer and shorter than the passive (\"was scored by Maya\").", ["The passive voice is wordier and less direct.", "", "The commas make it choppy, and it's still passive.", "The word order is unnatural."], ""], ["Style & Word Choice", "The [final outcome] of the match surprised everyone.", ["NO CHANGE", "outcome", "final end result", "ultimate final outcome"], 1, "An outcome is already final, so \"final\" is redundant.", ["\"Final outcome\" is redundant.", "", "\"Final end result\" repeats the idea three times.", "\"Ultimate final\" is doubly redundant."], ""], ["Style & Word Choice", "Honesty is a core [principal] of our team.", ["NO CHANGE", "principle", "principles'", "principality"], 1, "A \"principle\" is a rule or belief. A \"principal\" is the head of a school.", ["A principal is a person, like the head of a school.", "", "\"Principles'\" is plural and possessive.", "A principality is a territory ruled by a prince."], ""], ["Style & Word Choice", "[The reason we lost is because] we stopped running.", ["NO CHANGE", "We lost because", "The reason why we lost is because", "Because of the reason that we lost,"], 1, "\"The reason is because\" is redundant. \"We lost because\" is direct.", ["\"Reason\" and \"because\" say the same thing.", "", "Adding \"why\" makes it even more redundant.", "This is confusing and ungrammatical."], ""], ["Style & Word Choice", "Daniel [didn't give a hoot about] the king's threat and kept praying.", ["NO CHANGE", "was not swayed by", "couldn't care less about", "was all like whatever about"], 1, "Formal writing calls for formal wording. \"Was not swayed by\" fits the serious tone.", ["\"Didn't give a hoot\" is too casual for this tone.", "", "\"Couldn't care less\" is casual.", "This is slang."], ""], ["Style & Word Choice", "[Each and every single player] signed the card for Coach.", ["NO CHANGE", "Every player", "Each and every one player", "All of every player"], 1, "\"Every player\" says it once. The rest repeats it.", ["\"Each,\" \"every,\" and \"single\" all mean the same thing.", "", "This is redundant and ungrammatical.", "\"All of every\" is ungrammatical."], ""], ["Style & Word Choice", "We [couldn't hardly] see the ball in the fog.", ["NO CHANGE", "could hardly", "couldn't barely", "could not hardly"], 1, "\"Hardly\" is already negative, so \"couldn't hardly\" is a double negative.", ["\"Couldn't hardly\" is a double negative.", "", "\"Couldn't barely\" is also a double negative.", "\"Could not hardly\" is still a double negative."], ""], ["Style & Word Choice", "Everyone [except] the goalkeeper ran laps.", ["NO CHANGE", "accept", "expect", "excepting for"], 0, "\"Except\" means \"not including.\"", ["", "\"Accept\" means to receive or agree to.", "\"Expect\" means to look forward to.", "\"Excepting for\" is wordy and nonstandard."], ""], ["Style & Word Choice", "The final score was [3–1, and the score meant] we advanced.", ["NO CHANGE", "3–1, which meant", "3–1, and the score of 3–1 meant", "3–1. The score meant that"], 1, "\"Which meant\" links the ideas without repeating \"the score.\"", ["This repeats \"score\" unnecessarily.", "", "This repeats both \"score\" and \"3–1.\"", "Correct grammar, but it repeats \"score\" and is wordier."], ""], ["Transitions & Organization", "Our team was smaller than every opponent. [Therefore,] we won the league.", ["NO CHANGE", "Nevertheless,", "Similarly,", "For example,"], 1, "Being smaller is a disadvantage, yet they won. That's a contrast, so \"Nevertheless\" fits.", ["\"Therefore\" means being small caused the win, which doesn't make sense.", "", "\"Similarly\" signals a similar idea, but this is a contrast.", "Winning the league isn't an example of being smaller."], ""], ["Transitions & Organization", "It rained all morning. [However,] the field was too muddy to use.", ["NO CHANGE", "As a result,", "In contrast,", "Meanwhile,"], 1, "The rain caused the mud. That's cause and effect, so \"As a result\" fits.", ["\"However\" signals a contrast, but the mud follows from the rain.", "", "\"In contrast\" signals a difference that isn't there.", "\"Meanwhile\" signals time, not cause."], ""], ["Transitions & Organization", "Daily prayer brings peace. [In contrast,] it reminds us that we are not alone.", ["NO CHANGE", "In addition,", "Instead,", "Otherwise,"], 1, "The second sentence adds another benefit, so use an addition word.", ["\"In contrast\" signals a difference, but both sentences describe benefits.", "", "\"Instead\" suggests replacing the first idea.", "\"Otherwise\" suggests an alternative or a consequence."], ""], ["Transitions & Organization", "Many great athletes are also people of faith. [Nevertheless,] some thank God in interviews after every game.", ["NO CHANGE", "For example,", "Consequently,", "On the other hand,"], 1, "Thanking God in interviews is an example of athletes showing their faith.", ["\"Nevertheless\" signals a contrast, but the second sentence supports the first.", "", "\"Consequently\" signals a result, not an example.", "\"On the other hand\" signals a contrast."], ""], ["Transitions & Organization", "The coach blew the whistle. [On the other hand,] practice began.", ["NO CHANGE", "Then,", "However,", "In conclusion,"], 1, "One event follows the other, so use a time word: Then.", ["There's no contrast between the whistle and practice starting.", "", "\"However\" signals a contrast that isn't there.", "\"In conclusion\" is for summing up, not for a sequence of events."], ""], ["Transitions & Organization", "Before every game, our team meets for a short prayer. Players take turns thanking God and asking for safety on the field.", ["Yes, because it adds an interesting historical fact.", "Yes, because it explains why the team prays.", "No, because it shifts away from the paragraph's focus on the team's prayer.", "No, because it contradicts the earlier sentences."], 2, "The paragraph is about the team's prayer before games. Soccer ball history is off topic.", ["Interesting isn't enough. It has to fit the paragraph's focus.", "It says nothing about why the team prays.", "", "It doesn't contradict anything. It's just off topic."], "The writer is considering adding this sentence at the end: \"The first soccer balls were made from inflated animal bladders.\" Should the writer make this addition?"], ["Transitions & Organization", "My grandmother's church was [nice].", ["NO CHANGE", "a small white building with a creaky wooden steeple", "really nice", "a church building"], 1, "This choice gives specific, vivid details: size, color, and the creaky steeple.", ["\"Nice\" is vague. It doesn't describe the church.", "", "\"Really nice\" is still vague.", "\"A church building\" tells us nothing new."], "Which choice gives the most specific description of the church?"], ["Transitions & Organization", "[Joseph had eleven brothers.] Years after they sold him into slavery, he welcomed them with tears and fed their families during the famine.", ["NO CHANGE", "Joseph's story shows that forgiveness can heal even deep betrayal.", "Egypt was a powerful kingdom in Joseph's time.", "Many people enjoy reading about Joseph."], 1, "The paragraph is about Joseph forgiving his brothers. This choice states that main idea.", ["True, but it doesn't introduce the main idea of forgiveness.", "", "Egypt isn't the focus of the paragraph.", "This is vague and doesn't introduce the main point."], "Which choice most effectively introduces the paragraph's main point?"], ["Transitions & Organization", "Every day after practice, Eli spent thirty minutes kicking with his weaker left foot. By the end of the season, defenders could no longer force him to one side. [He also liked pizza.]", ["NO CHANGE", "His extra work had turned a weakness into a strength.", "Left-footed players are rare.", "The season lasted four months."], 1, "A strong conclusion sums up the paragraph's point: hard work turned a weakness into a strength.", ["Pizza has nothing to do with the paragraph.", "", "This is a general fact, not a conclusion about Eli.", "This detail doesn't sum up anything."], "Which choice most effectively concludes the paragraph?"], ["Transitions & Organization", "Nehemiah heard that Jerusalem's walls lay in ruins. [He wept and prayed for days.] Then he asked the king for permission to rebuild.", ["a detail showing Nehemiah's emotional and spiritual response before he acted", "an explanation of why the walls had fallen", "a description of the king", "nothing, because the sentence is unrelated to the paragraph"], 0, "The sentence shows how Nehemiah reacted, through grief and prayer, before he acted.", ["", "The sentence doesn't explain why the walls fell.", "The sentence isn't about the king.", "The sentence is related. It connects the news to his action."], "If the writer deleted the underlined sentence, the paragraph would primarily lose:"], ["Transitions & Organization", "The disciples were terrified in the storm. [Similarly,] Jesus slept peacefully in the boat.", ["NO CHANGE", "In contrast,", "Therefore,", "For instance,"], 1, "Terrified disciples and a peacefully sleeping Jesus are opposites, so use a contrast word.", ["\"Similarly\" suggests they acted alike, but they didn't.", "", "\"Therefore\" means the fear caused Jesus to sleep.", "Jesus sleeping isn't an example of the disciples' fear."], ""], ["Transitions & Organization", "The ACT math section has 45 questions. [As a result, students] get 50 minutes to finish it.", ["NO CHANGE", "Students", "However, students", "For example, students"], 1, "No transition is needed. These are two related facts. One doesn't cause, contrast with, or give an example of the other.", ["The number of questions doesn't cause the time limit.", "", "There's no contrast between the two facts.", "The time limit isn't an example of the question count."], ""], ["Transitions & Organization", "Mia is our most reliable defender. [She has a dog named Biscuit.]", ["NO CHANGE", "She has not missed a tackle in her last six games.", "She started playing soccer at age five.", "Her favorite color is green."], 1, "Only this choice gives evidence that she's reliable.", ["Her dog has nothing to do with being a reliable defender.", "", "Starting young doesn't prove reliability.", "Her favorite color is irrelevant."], "Which choice best supports the claim made in the previous sentence?"], ["Transitions & Organization", "Ruth could have returned to her own people. [Consequently,] she chose to stay with Naomi.", ["NO CHANGE", "Instead,", "For example,", "Likewise,"], 1, "She could have gone home, but she stayed. \"Instead\" shows that choice.", ["\"Consequently\" means staying was caused by being able to leave, which is backward.", "", "Staying isn't an example of returning.", "\"Likewise\" signals a similar idea, but this is the opposite choice."], ""], ["Transitions & Organization", "The team lost its first three games. [In conclusion,] it won the next ten in a row.", ["NO CHANGE", "After that,", "For example,", "Similarly,"], 1, "These events happen in order, so use a time transition.", ["\"In conclusion\" is for summing up, not for the next event.", "", "Winning ten games isn't an example of losing three.", "Winning isn't similar to losing."], ""], ["Transitions & Organization", "Paul was in [prison. He wrote] letters full of joy.", ["NO CHANGE", "prison, yet he wrote", "prison, so he wrote", "prison, for example, he wrote"], 1, "Writing joyful letters from prison is surprising, so \"yet\" captures the contrast.", ["Two short sentences don't show the surprising contrast.", "", "\"So\" means prison caused the joy.", "This isn't an example, and it creates a comma splice."], "Which choice most effectively combines the sentences at the underlined portion?"], ["Transitions & Organization", "Practice ends at five. [Afterward,] the team serves dinner at the shelter.", ["NO CHANGE", "However,", "For example,", "In contrast,"], 0, "Serving dinner comes after practice, so \"Afterward\" fits.", ["", "There's no contrast between practice and serving dinner.", "Serving dinner isn't an example of practice ending.", "There's no contrast here."], ""]];
const EKEY="act-eng-progress-v1";
let eprog={};try{eprog=JSON.parse(localStorage.getItem(EKEY)||"{}")||{}}catch(e){eprog={}}
const esave=()=>{try{localStorage.setItem(EKEY,JSON.stringify(eprog))}catch(e){}};
let eset=null;
ECATS.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+" ("+ENG.filter(x=>x[0]===c).length+")";$("eTopic").appendChild(o)});
function eStats(){const t=$("eTopic").value;const ids=ENG.map((x,i)=>i).filter(i=>t==="all"||ENG[i][0]===t);
  $("eStats").textContent=`${ids.filter(i=>eprog[i]==="right").length} of ${ids.length} ${t==="all"?"questions":t+" questions"} answered correctly`}
function newEngSet(onlyMissed){
  const t=$("eTopic").value;let pool=ENG.map((x,i)=>i).filter(i=>t==="all"||ENG[i][0]===t);
  if(onlyMissed){const miss=pool.filter(i=>eprog[i]==="wrong");if(miss.length)pool=miss}
  else{const fresh=pool.filter(i=>!eprog[i]),notRight=pool.filter(i=>eprog[i]!=="right");
    if(fresh.length>=10)pool=fresh;else if(notRight.length>=10)pool=notRight}
  eset={ids:shuffle(pool).slice(0,10),n:0,score:0,missed:[]};startTimer(eset,"e",renderEng);
}
const escH=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const engSent=s=>escH(s).replace(/\[(.*?)\]/,"<u>$1</u>");
function renderEng(){
  eStats();const b=$("eBody");
  if(!eset)newEngSet(false);
  if(eset.n>=eset.ids.length){
    const tt=$("eTopic").value;const anyMissed=ENG.some((x,i)=>eprog[i]==="wrong"&&(tt==="all"||x[0]===tt));
    b.innerHTML=`<div class="q"><div class="qnum">Set complete</div><div class="score">${eset.score}/${eset.ids.length}</div>${timeSummary(eset,"e")}
    ${eset.missed.length?`<div class="feedback">Review: ${eset.missed.map(i=>"<b>"+ENG[i][0]+"</b> · "+escH(ENG[i][1].replace(/[\[\]]/g,"")).slice(0,70)+"…").join("<br>")}</div>`:(eset.score===eset.ids.length?`<div class="qprompt">Perfect set.</div>`:"")}
    <div class="row" style="justify-content:flex-start"><button class="btn primary" id="eNew">New set of 10</button>${anyMissed?`<button class="btn" id="eRetry">Retry missed questions</button>`:""}</div></div>`;
    $("eNew").onclick=()=>{newEngSet(false);renderEng()};if(anyMissed)$("eRetry").onclick=()=>{newEngSet(true);renderEng()};return;
  }
  const id=eset.ids[eset.n],x=ENG[id],[cat,s,ch,ans,ex,why,q]=x,L=LETTERS[eset.n%2];
  const order=ch[0]==="NO CHANGE"?[0,...shuffle([1,2,3])]:shuffle([0,1,2,3]);
  b.innerHTML=`<div class="q"><div class="row"><span class="qnum">Question ${eset.n+1} of ${eset.ids.length}</span><span class="row" style="gap:8px">${clockHTML(eset,"e")}<span class="mtag">${cat}</span></span></div>
  <div class="passage">${engSent(s)}</div>
  <div class="qprompt" style="font-size:16px">${q?escH(q):"Which choice is best for the underlined portion?"}</div>
  <div class="opts">${order.map((k,i)=>`<button class="opt" data-k="${k}"><span class="bub">${L[i]}</span><span>${escH(ch[k])}</span></button>`).join("")}</div>
  <div id="efb"></div></div>`;
  b.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const k=+btn.dataset.k,ok=k===ans;
    b.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===ans)o.classList.add("right")});
    eset.answered=(eset.answered||0)+1;logAct("e",ok);
    if(ok){eset.score++;eprog[id]="right"}else{btn.classList.add("wrong");eset.missed.push(id);eprog[id]="wrong"}
    esave();eStats();
    const others=[0,1,2,3].filter(j=>j!==ans&&j!==k);
    $("efb").innerHTML=`<div class="why">
      ${ok?"":`<div class="blk bad"><b class="h">Why “${escH(ch[k])}” is wrong</b>${escH(why[k])}</div>`}
      <div class="blk ok"><b class="h">${ok?"Correct.":"The right answer is “"+escH(ch[ans])+".”"} Here's why:</b>${escH(ex)}</div>
      <details ${ok?"":"open"}><summary>Why the ${ok?"other three choices are":"other wrong choices are"} wrong</summary><ul>${others.map(j=>`<li><b>${escH(ch[j])}:</b> ${escH(why[j])}</li>`).join("")}</ul></details>
    </div>
    <div style="margin-top:14px"><button class="btn primary" id="eNext">${eset.n+1<eset.ids.length?"Next question":"See results"}</button></div>`;
    $("eNext").onclick=()=>{eset.n++;renderEng()};$("eNext").focus();
  });
}
$("eTopic").onchange=()=>{eset=null;renderEng()};
$("mTimed").onchange=onTimedChange;$("eTimed").onchange=onTimedChange;syncTimed();

/* ---- tabs ---- */
function show(name){
  ["study","quiz","list","math","english","goals"].forEach(n=>{$("tab-"+n).setAttribute("aria-selected",n===name);const v=$("view-"+n);v.hidden=n!==name;if(n!=="quiz")v.style.display=n===name?"flex":"none"});
  if(name==="quiz"&&(!quiz||quiz.n>=quiz.items.length))startQuiz();
  if(name==="list")renderList();if(name==="study")buildDeck(false);if(name==="math")renderMath();if(name==="goals")renderGoals();if(name==="english")renderEng();
}
["study","quiz","list","math","english","goals"].forEach(n=>$("tab-"+n).onclick=()=>show(n));

updateStats();buildDeck(true);setTimeout(()=>syncNow(false),1500);
</script>
