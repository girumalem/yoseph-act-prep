<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1fa">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brooke's Study Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: answer-sheet tint, one card at center, mode tabs on top, bubble answers like a real ACT form */
:root{
  --paper:#edf1fa; --sheet:#fbfcff; --ink:#1d2333; --muted:#5a6380; --rule:#c8d0e6;
  --pencil:#f2b705; --pencil-ink:#2a2000; --bubble:#2f3a34;
  --good:#1f7a4a; --good-bg:#dff1e6; --warn:#a84a12; --warn-bg:#fbe7d8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121626; --sheet:#1a2035; --ink:#e8ecf8; --muted:#9aa3c2; --rule:#2e3754;
  --pencil:#f2c53d; --pencil-ink:#221a00; --bubble:#c9d6cd;
  --good:#6fd39b; --good-bg:#16352a; --warn:#f0a06b; --warn-bg:#3a2516; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121626; --sheet:#1a2035; --ink:#e8ecf8; --muted:#9aa3c2; --rule:#2e3754;
  --pencil:#f2c53d; --pencil-ink:#221a00; --bubble:#c9d6cd;
  --good:#6fd39b; --good-bg:#16352a; --warn:#f0a06b; --warn-bg:#3a2516; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{background:var(--pencil);color:var(--pencil-ink);padding:0 .15em;border-radius:3px}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:16px;display:block}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
nav{display:flex;gap:6px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
nav button{font-family:var(--display);font-weight:700;font-size:15px;background:none;border:0;color:var(--muted);
  padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--pencil)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
select,input[type=search]{font:inherit;font-size:14px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* flashcard */
.scene{perspective:1400px}
.card{position:relative;min-height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;
  padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px;
  background-image:repeating-linear-gradient(var(--sheet) 0 31px,var(--rule) 31px 32px);background-position:0 18px}
.back{transform:rotateY(180deg)}
.word{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,58px);line-height:1;letter-spacing:-.02em;text-align:center;word-break:break-word}
.pos{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;position:absolute;bottom:14px;left:0;right:0}
.def{font-size:21px;font-weight:600;line-height:1.35;text-wrap:balance}
.ex{font-style:italic;color:var(--muted);max-width:60ch}
.ex mark{background:none;color:var(--ink);font-weight:600;font-style:normal;border-bottom:2px solid var(--pencil)}
.tag{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--rule);color:var(--ink)}
.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;border-radius:8px;padding:12px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn.learn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.btn.know{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.primary{background:var(--pencil);color:var(--pencil-ink);border-color:transparent}
.keys{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
@media (max-width:480px){.controls{grid-template-columns:1fr 1fr}.controls .nav{order:3}.face{padding:20px}.keys{display:none}}

/* quiz */
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.qprompt{font-size:19px;line-height:1.4}
.qprompt strong{font-family:var(--display);font-size:26px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;background:none;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--bubble)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bubble);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)} .opt.wrong .bub{background:var(--bubble);color:var(--sheet)}
.opt:disabled{cursor:default}
.feedback{font-size:15px;color:var(--muted)}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}

/* list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item p{margin:0;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--rule)}
.dot.known{background:var(--good);border-color:var(--good)} .dot.learning{background:var(--warn);border-color:var(--warn)}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.reset{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;text-decoration:underline;cursor:pointer}

/* math */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--display);font-weight:700;font-size:14px;background:var(--sheet);color:var(--muted);border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pencil);color:var(--pencil-ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.fcard{text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard .cat{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fcard h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
.fcard .fx{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.fcard .note{font-size:14px;color:var(--muted)}
.fcard .peek{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fcard.open{border-color:var(--pencil)}
.mtag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--rule)}
.work{border-left:3px solid var(--pencil);padding:4px 0 4px 12px;color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.6}

/* goals */
.goalhead{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px}
.goalhead .amt{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--rule);color:var(--ink)}
.pill.won{background:var(--good);color:var(--sheet)}
.goals{display:flex;flex-direction:column;gap:10px}
.goal{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal .gl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal b{font-family:var(--display);font-size:16px}
.goal .num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.goal.done{border-color:var(--good)} .goal.done .num{color:var(--good);font-weight:700}
.gbar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--pencil)}
.goal.done .gbar i{background:var(--good)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.day i{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:block}
.day.on i{background:var(--good);border-color:var(--good)} .day.today{color:var(--ink);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:6px 0}
.report{width:100%;min-height:200px;font-family:var(--mono);font-size:13px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px}
.exl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--muted);margin-bottom:2px}
.why{display:flex;flex-direction:column;gap:10px}
.why .blk{border-left:3px solid var(--rule);padding:2px 0 2px 12px;font-size:15px;line-height:1.5}
.why .blk.ok{border-color:var(--good)} .why .blk.bad{border-color:var(--warn)}
.why .blk b.h{display:block;font-family:var(--display);font-size:14px;margin-bottom:2px}
.why details{font-size:14px;color:var(--muted)} .why summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--ink)}
.why details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.qsent{font-style:italic;border-left:3px solid var(--pencil);padding-left:12px}
.tog{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 12px}
.tog input{width:18px;height:18px;accent-color:var(--good)}
.clock{font-family:var(--mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:var(--rule);color:var(--ink)}
.clock.low{background:var(--warn-bg);color:var(--warn)}
.passage{font-size:18px;line-height:1.6}
.passage u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--pencil);font-weight:600}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Brooke's <span>Study</span> Quest</h1>
      <div class="sub">Vocab · English · Math · <span id="total"></span> words</div>
    </div>
    <div class="stats">
      <div><b id="sKnown">0</b>mastered</div>
      <div><b id="sLearn">0</b>learning</div>
      <div><b id="sNew">0</b>new</div>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

  <nav role="tablist">
    <button role="tab" id="tab-study" aria-selected="true">Flashcards</button>
    <button role="tab" id="tab-quiz" aria-selected="false">Vocab quiz</button>
    <button role="tab" id="tab-list" aria-selected="false">Word list</button>
    <button role="tab" id="tab-math" aria-selected="false">Math</button>
    <button role="tab" id="tab-english" aria-selected="false">English</button>
    <button role="tab" id="tab-goals" aria-selected="false">Weekly goal</button>
  </nav>

  <!-- STUDY -->
  <section id="view-study" style="display:flex;flex-direction:column;gap:14px">
    <div class="row">
      <select id="deckFilter" aria-label="Which cards to study">
        <option value="all">All words</option>
        <option value="unknown">Not mastered yet</option>
        <option value="learning">Still learning only</option>
        <option value="new">New only</option>
      </select>
      <div class="row" style="gap:10px">
        <button class="btn" id="shuffleBtn" style="padding:8px 12px;font-size:13px">Shuffle</button>
        <span class="counter" id="cardCount"></span>
      </div>
    </div>
    <div class="scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
        <div class="face front">
          <span class="tag" id="fTag" hidden></span>
          <div class="word" id="fWord"></div>
          <div class="pos" id="fPos"></div>
          <div class="hint">Tap to see the definition</div>
        </div>
        <div class="face back">
          <div class="pos" style="text-align:left" id="bWord"></div>
          <div class="def" id="bDef"></div>
          <div class="ex" id="bEx"></div>
          <div class="ex" id="bFx"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn nav" id="prevBtn" aria-label="Previous card">←</button>
      <button class="btn learn" id="learnBtn">Still learning</button>
      <button class="btn know" id="knowBtn">Got it</button>
      <button class="btn nav" id="nextBtn" aria-label="Next card">→</button>
    </div>
    <div class="keys">Keyboard: Space flips · ← → move · 1 still learning · 2 got it</div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" hidden></section>

  <!-- LIST -->
  <section id="view-list" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <input type="search" id="search" placeholder="Search words or meanings" aria-label="Search words">
      <div class="legend">
        <span><i class="dot known"></i>mastered</span>
        <span><i class="dot learning"></i>learning</span>
        <span><i class="dot"></i>new</span>
        <button class="reset" id="resetBtn">Reset progress</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
<!-- GOALS -->
  <section id="view-goals" hidden style="flex-direction:column;gap:16px"></section>

  <!-- ENGLISH -->
  <section id="view-english" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <select id="eTopic" aria-label="English skill"><option value="all">All English skills</option></select>
      <label class="tog"><input type="checkbox" id="eTimed"> Timed challenge</label>
    </div>
    <div class="counter" id="eStats"></div>
    <div id="eBody"></div>
  </section>

  <!-- MATH -->
  <section id="view-math" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <div class="seg" role="group" aria-label="Math mode">
        <button id="mPractice" aria-pressed="true">Practice problems</button>
        <button id="mFormulas" aria-pressed="false">Formula cards</button>
      </div>
      <select id="mTopic" aria-label="Math topic"><option value="all">All 6th-grade topics</option></select>
      <label class="tog"><input type="checkbox" id="mTimed"> Timed challenge</label>
    </div>
    <div class="counter" id="mStats"></div>
    <div id="mBody"></div>
  </section>
</div>

<script>
const WORDS = [
["abundant", "adjective", "more than enough; plentiful", "Demeter made the fields abundant with grain until her daughter Persephone was taken away.", "God's love is abundant, so there's always enough to share."],
["accurate", "adjective", "correct and exact, with no mistakes", "Apollo's arrows were so accurate that they never missed their target.", "An accurate report tells the truth even when it's hard."],
["adapt", "verb", "to change to fit a new situation", "Percy had to adapt quickly when he discovered he was the son of Poseidon.", "Ruth had to adapt to a new country, but she stayed faithful."],
["admire", "verb", "to look up to someone with respect", "Young musicians admire the Muses, the nine goddesses of the arts.", "We admire people who are kind when no one is watching."],
["ancient", "adjective", "very old; from long ago", "The ancient Greeks told stories about gods who lived on Mount Olympus.", "The Psalms are ancient songs that people still sing today."],
["anthem", "noun", "a song of praise or loyalty, often sung by a group", "The crowd stood to sing the national anthem before the concert.", "Many old hymns are anthems of praise to God."],
["anxious", "adjective", "worried or nervous about what might happen", "Brooke felt anxious before her piano recital, then played beautifully.", "The Bible tells us not to be anxious but to bring our worries to God in prayer."],
["arrogant", "adjective", "acting as if you are better than others", "Arachne was so arrogant that she challenged Athena to a weaving contest.", "Arrogant people find it hard to say \"I'm sorry,\" but humble people grow."],
["assemble", "verb", "to gather together in one place", "Jason assembled a crew of heroes, called the Argonauts, to find the Golden Fleece.", "The church choir assembled early to practice the Easter songs."],
["astonish", "verb", "to surprise greatly", "Hermes astonished Apollo by inventing the lyre from a tortoise shell.", "Jesus astonished the crowd when he calmed the wind and waves."],
["authentic", "adjective", "real and genuine; not fake", "The museum displayed an authentic Greek vase painted with Hercules.", "Authentic friendship means loving people for who they really are."],
["benefit", "noun", "something helpful or good", "One benefit of practicing scales is that songs become easier to play.", "Helping at the food pantry is a benefit to our whole town."],
["betray", "verb", "to break someone's trust", "In the myth, Medea helped Jason, but later he betrayed her.", "Judas betrayed Jesus, but Jesus still showed love to his disciples."],
["boast", "verb", "to brag about yourself", "Queen Niobe boasted that she was greater than Leto, the mother of Apollo and Artemis.", "Paul wrote that if we boast, we should boast about what God has done."],
["brilliant", "adjective", "very bright or very smart", "Athena was the brilliant goddess of wisdom and strategy.", "The star over Bethlehem shone brilliant in the night sky."],
["cautious", "adjective", "careful to avoid danger", "Odysseus was cautious as his ship sailed past the monster Scylla.", "A cautious friend thinks before passing along gossip."],
["cease", "verb", "to stop", "When the music ceased, the whole audience began to clap.", "The storm ceased the moment Jesus said, \"Peace, be still.\""],
["chorus", "noun", "the part of a song that repeats; also, a group of singers", "Everyone joined in on the chorus of the camp song.", "The chorus of the hymn reminded us that God is faithful."],
["clarify", "verb", "to make clearer or easier to understand", "The music teacher clarified the difference between a whole note and a half note.", "Jesus often clarified his parables for the disciples."],
["collapse", "verb", "to fall down suddenly", "The walls of Troy never collapsed, so the Greeks had to sneak in with a wooden horse.", "Even if our plans collapse, God's promises stand firm."],
["compassion", "noun", "care and concern for others who are suffering", "The music teacher showed compassion when a nervous student forgot her part.", "The Good Samaritan showed compassion to a hurt stranger."],
["compose", "verb", "to create or write music or writing", "Brooke wants to compose her own song for the spring concert.", "King David composed many psalms while playing his harp."],
["conclude", "verb", "to end; or to decide after thinking", "The concert concluded with a loud, happy finale.", "After reading the story, we concluded that forgiveness takes courage."],
["confident", "adjective", "sure of yourself and your abilities", "Percy grew more confident each time he used his sword, Riptide.", "David was confident because he trusted God, not his own strength."],
["conflict", "noun", "a fight or disagreement", "The conflict between Athens and Sparta lasted many years.", "Jesus taught us to solve conflict by going to the person and talking."],

const STORE_KEY="brooke-vocab-progress-v1";
let progress={};
try{progress=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{}}catch(e){progress={}}
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(progress))}catch(e){}};
const status=w=>progress[w.w]||"new";
const $=id=>document.getElementById(id);

function updateStats(){
  let k=0,l=0;WORDS.forEach(w=>{const s=status(w);if(s==="known")k++;else if(s==="learning")l++});
  $("sKnown").textContent=k;$("sLearn").textContent=l;$("sNew").textContent=WORDS.length-k-l;
  $("barFill").style.width=(k/WORDS.length*100)+"%";$("total").textContent=WORDS.length;
}

/* ---- study ---- */
let deck=[],idx=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(doShuffle){
  const f=$("deckFilter").value;
  deck=WORDS.filter(w=>{const s=status(w);return f==="all"||(f==="unknown"&&s!=="known")||s===f});
  if(doShuffle)deck=shuffle(deck);idx=0;render();
}
function highlight(ex,word){
  const stem=word.length>5?word.slice(0,word.length-2):word;
  const re=new RegExp("\\b("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return esc(ex).replace(re,"<mark>$1</mark>");
}
function render(){
  const card=$("card");card.classList.remove("flipped");
  if(!deck.length){
    $("fWord").textContent="All done";$("fPos").textContent="No cards in this pile — pick another filter";
    $("fTag").hidden=true;$("cardCount").textContent="0 / 0";$("bDef").textContent="";$("bEx").textContent="";$("bFx").textContent="";$("bWord").textContent="";return;
  }
  const w=deck[idx];const s=status(w);
  $("fWord").textContent=w.w;$("fPos").textContent=w.p;
  $("fTag").hidden=s==="new";$("fTag").textContent=s==="known"?"mastered":"still learning";
  $("bWord").textContent=w.w+" · "+w.p;$("bDef").textContent=w.d;$("bEx").innerHTML=highlight(w.e,w.w);$("bFx").innerHTML=highlight(w.f,w.w);
  $("cardCount").textContent=(idx+1)+" / "+deck.length;
}
const flip=()=>$("card").classList.toggle("flipped");
const move=d=>{if(!deck.length)return;idx=(idx+d+deck.length)%deck.length;render()};
function mark(s){
  if(!deck.length)return;logAct("card");progress[deck[idx].w]=s;save();updateStats();
  const f=$("deckFilter").value;
  const stillFits=f==="all"||(f==="unknown"&&s!=="known")||f===s;
  if(!stillFits){deck.splice(idx,1);if(idx>=deck.length)idx=0;render()}else move(1);
}
$("card").onclick=flip;
$("card").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();flip()}};
$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);
$("learnBtn").onclick=()=>mark("learning");$("knowBtn").onclick=()=>mark("known");
$("shuffleBtn").onclick=()=>buildDeck(true);$("deckFilter").onchange=()=>buildDeck(true);
document.addEventListener("keydown",e=>{
  if($("view-study").hidden||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="1")mark("learning");else if(e.key==="2")mark("known");
});

/* ---- quiz ---- (ACT answer sheets alternate A–D on odd items, F–J on even) */
const LETTERS=[["A","B","C","D"],["A","B","C","D"]];
let quiz=null;
function startQuiz(){
  const weak=WORDS.filter(w=>status(w)!=="known");
  const pool=shuffle(weak.length>=10?weak:WORDS).slice(0,10);
  quiz={items:pool.map((w,i)=>{
    const sent=Math.random()<.5?w.e:w.f;
    const exact=new RegExp("\\b"+w.w+"\\b","i").test(sent);
    const type=(i%2&&exact)?"word":"def";
    const others=shuffle(WORDS.filter(x=>x.id!==w.id&&x.p===w.p)).slice(0,3);
    while(others.length<3){const x=WORDS[Math.floor(Math.random()*WORDS.length)];if(x.id!==w.id&&!others.includes(x))others.push(x)}
    return{w,type,sent,opts:shuffle([w,...others])}}),n:0,score:0,missed:[]};
  renderQ();
}
function renderQ(){
  const v=$("view-quiz");
  if(quiz.n>=quiz.items.length){
    const pct=Math.round(quiz.score/quiz.items.length*100);
    v.innerHTML=`<div class="q"><div class="qnum">Quiz complete</div><div class="score">${quiz.score}/${quiz.items.length}</div>
    <div class="qprompt">${pct>=90?"Excellent. These words are locked in.":pct>=70?"Solid work. Review the misses below.":"Keep going. The missed words were added to your Still learning pile."}</div>
    ${quiz.missed.length?`<div class="feedback"><b>Review:</b> ${quiz.missed.map(w=>`<b>${w.w}</b> (${w.d})`).join("; ")}</div>`:""}
    <div><button class="btn primary" id="again">Take another quiz</button></div></div>`;
    $("again").onclick=startQuiz;return;
  }
  const it=quiz.items[quiz.n],L=LETTERS[quiz.n%2];
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const blank=esc(it.sent).replace(new RegExp("\\b"+it.w.w+"\\b","i"),"_______");
  const prompt=it.type==="def"
    ?`<div class="qsent">${highlight(it.sent,it.w.w)}</div><div style="margin-top:10px">As it is used in the sentence above, the word <strong>${it.w.w}</strong> most nearly means:</div>`
    :`<div class="qsent">${blank}</div><div style="margin-top:10px">Which choice best completes the sentence?</div>`;
  v.innerHTML=`<div class="q"><div class="row"><span class="qnum">Question ${quiz.n+1} of ${quiz.items.length}</span><span class="counter">Score ${quiz.score}</span></div>
  <div class="qprompt">${prompt}</div>
  <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-id="${o.id}"><span class="bub">${L[i]}</span><span>${it.type==="def"?o.d:o.w}</span></button>`).join("")}</div>
  <div class="feedback" id="fb"></div></div>`;

function answer(btn,it){
  const ok=+btn.dataset.id===it.w.id;
  $("view-quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.id===it.w.id)b.classList.add("right")});
  logAct("vq",ok);if(ok){quiz.score++}else{btn.classList.add("wrong");quiz.missed.push(it.w);progress[it.w.w]="learning";save();updateStats()}
  const pick=it.opts.find(o=>o.id===+btn.dataset.id);
  $("fb").innerHTML=`<div class="why">
    ${ok?"":`<div class="blk bad"><b class="h">Why your choice doesn't fit</b>${it.type==="def"?`That definition belongs to <b>${pick.w}</b>. It doesn't match how <b>${it.w.w}</b> is used here.`:`<b>${pick.w}</b> means “${pick.d}.” That meaning doesn't fit this sentence.`}</div>`}
    <div class="blk ok"><b class="h">${ok?"Correct:":"The answer:"} ${it.w.w} (${it.w.p})</b>${it.w.d}. Ask yourself whether the meaning makes sense in the sentence. If you swap it in for the word, the sentence should still read naturally.</div>
    <div class="blk"><span class="exl">Examples</span><i>${highlight(it.w.e,it.w.w)}</i><br><i>${highlight(it.w.f,it.w.w)}</i></div>
  </div><div style="margin-top:12px"><button class="btn primary" id="nextQ">${quiz.n+1<quiz.items.length?"Next question":"See results"}</button></div>`;
  $("nextQ").onclick=()=>{quiz.n++;renderQ()};$("nextQ").focus();
}

/* ---- list ---- */
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  $("list").innerHTML=WORDS.filter(w=>!q||w.w.includes(q)||w.d.toLowerCase().includes(q))
    .map(w=>`<div class="item"><h3>${w.w}<i class="dot ${status(w)}" title="${status(w)}"></i></h3><p><i>${w.p}</i> · ${w.d}</p></div>`).join("")
    ||`<p class="feedback">No words match “${q.replace(/</g,"&lt;")}”.</p>`;
}
$("search").oninput=renderList;

const timers={};
const fmtT=s=>{s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const leftOf=set=>set.limit-Math.floor((Date.now()-set.start)/1000);
function startTimer(set,key,rerender){clearInterval(timers[key]);set.start=Date.now();set.answered=0;set.timed=TIMED;
  if(!TIMED)return;set.limit=Math.round(set.ids.length*SEC[key]);
  timers[key]=setInterval(()=>{const left=leftOf(set),el=$(key+"Clock");if(el){el.textContent=fmtT(left);el.classList.toggle("low",left<=60)}
    if(left<=0){clearInterval(timers[key]);if(set.n<set.ids.length){set.timeUp=true;set.n=set.ids.length;rerender()}}},500)}
function clockHTML(set,key){if(!set.timed)return"";const l=leftOf(set);return `<span class="clock ${l<=60?"low":""}" id="${key}Clock" title="Time left">${fmtT(l)}</span>`}
function timeSummary(set,key){clearInterval(timers[key]);if(!set.timed)return"";
  if(set.used==null)set.used=Math.min(set.limit,Math.round((Date.now()-set.start)/1000));
  const per=set.answered?Math.round(set.used/set.answered):0;
  return `<div class="feedback">${set.timeUp?`<b>Time ran out.</b> You answered ${set.answered} of ${set.ids.length}. `:""}Time used: ${fmtT(set.used)} of ${fmtT(set.limit)}.${set.timeUp?` Keep moving: the challenge pace is about ${Math.round(SEC[key])} seconds per question, so skip and come back to hard ones.`:` That's about ${per} seconds per question; the challenge pace is ${Math.round(SEC[key])}.`}</div>`}

function newMathSet(onlyMissed){
  const t=$("mTopic").value;let pool=PROBLEMS.map((p,i)=>i).filter(i=>t==="all"||PROBLEMS[i][0]===t);
  if(onlyMissed){const miss=pool.filter(i=>mprog[i]==="wrong");if(miss.length)pool=miss}
  else{const fresh=pool.filter(i=>!mprog[i]),notRight=pool.filter(i=>mprog[i]!=="right");
    if(fresh.length>=10)pool=fresh;else if(notRight.length>=10)pool=notRight}
  mset={ids:shuffle(pool).slice(0,10),n:0,score:0,missed:[]};startTimer(mset,"m",renderMath);renderMath();
}

let lastTick=0;
function logAct(type,ok){
  const now=Date.now(),k=dkey(now);const d=act[k]||(act[k]={cards:0,vq:0,vqc:0,m:0,mc:0,sets:0,ms:0});
  if(lastTick&&now-lastTick<15*60000)d.ms+=Math.min(now-lastTick,90000);lastTick=now;
  if(type==="card")d.cards++;
  else if(type==="vq"){d.vq++;if(ok)d.vqc++}
  else if(type==="m"){d.m++;if(ok)d.mc++}
  else if(type==="set")d.sets++;
  else if(type==="e"){d.e=(d.e||0)+1;if(ok)d.ec=(d.ec||0)+1}
  asave();scheduleSync();

table\" mean?", ["not able to be predicted", "able to be predicted", "predicted again", "predicted before"], 0, "Un- (not) + predictable (able to be predicted) = not able to be predicted.", ["", "That's the opposite. \"Un-\" means not.", "\"Again\" would be the prefix \"re-.\"", "\"Before\" would be the prefix \"pre-.\""], "Use the prefix to decide."], ["Word Choice & Context Clues", "Brooke felt [nervous] before the recital, but she prayed and felt calm.", ["Correct as is", "bored", "angry", "sleepy"], 0, "\"But she prayed and felt calm\" shows a change from nervous to calm.", ["", "Feeling bored doesn't contrast with calm in the same way.", "Nothing in the sentence suggests anger.", "Sleepy doesn't contrast with calm."], "Which word fits the context best?"], ["Word Choice & Context Clues", "The Minotaur was [ferocious], roaring and charging at anyone who entered.", ["fierce and wild", "gentle", "tiny", "silly"], 0, "\"Roaring and charging\" shows the Minotaur was fierce and wild.", ["", "A gentle creature wouldn't roar and charge.", "Nothing in the sentence is about size.", "Nothing in the sentence is funny."], "What does \"ferocious\" most likely mean?"], ["Word Choice & Context Clues", "Which word best completes the sentence? \"Arachne was so ____ that she refused to admit Athena was a better weaver.\"", ["prideful", "humble", "grateful", "patient"], 0, "Refusing to admit someone is better shows pride.", ["", "A humble person would admit it.", "Gratitude doesn't fit refusing to admit something.", "Patience doesn't fit this sentence."], "Choose the best word."], ["Word Choice & Context Clues", "The suffix \"-less\" means \"without.\" What does \"fearless\" mean?", ["without fear", "full of fear", "a little fear", "causing fear"], 0, "Fear + -less (without) = without fear.", ["", "\"Full of\" would be the suffix \"-ful.\"", "\"-less\" means without, not a little.", "That would be \"fearsome.\""], "Use the suffix to decide."], ["Word Choice & Context Clues", "The music teacher spoke in a [soothing] voice, and the nervous students relaxed.", ["calming", "harsh", "silly", "fast"], 0, "The students relaxed, which shows the voice was calming.", ["", "A harsh voice wouldn't relax nervous students.", "Nothing in the sentence is funny.", "Speed isn't the clue. The calming effect is."], "What does \"soothing\" most likely mean?"], ["Word Choice & Context Clues", "Which sentence uses the most precise word?", ["The giant stomped through the village.", "The giant went through the village.", "The giant moved through the village.", "The giant did things in the village."], 0, "\"Stomped\" shows exactly how the giant moved. Precise words make writing vivid.", ["", "\"Went\" is vague.", "\"Moved\" is vague.", "\"Did things\" is very vague."], "Choose the most precise sentence."], ["Word Choice & Context Clues", "Choose the best transition: \"Odysseus missed his family. ____, he kept sailing toward home.\"", ["Therefore", "However", "For example", "In contrast"], 0, "Missing his family is the reason he kept sailing, so \"Therefore\" shows cause and effect.", ["", "\"However\" shows contrast, but these ideas go together.", "Sailing home isn't an example of missing family.", "There's no contrast here."], "Choose the best transition."], ["Word Choice & Context Clues", "Choose the best transition: \"Brooke practiced every day. ____, she earned the solo.\"", ["As a result", "On the other hand", "Instead", "Meanwhile"], 0, "Earning the solo happened because of her practice. That's cause and effect.", ["", "\"On the other hand\" shows contrast.", "\"Instead\" suggests something replaced the practice.", "\"Meanwhile\" shows two things happening at once."], "Choose the best transition."], ["Word Choice & Context Clues", "Which word is a synonym for \"enormous\"?", ["huge", "tiny", "quick", "quiet"], 0, "A synonym means the same thing. Enormous and huge both mean very big.", ["", "\"Tiny\" is an antonym (the opposite).", "\"Quick\" is about speed.", "\"Quiet\" is about sound."], "Choose the synonym."], ["Word Choice & Context Clues", "Which word is an antonym for \"generous\"?", ["selfish", "kind", "giving", "helpful"], 0, "An antonym means the opposite. The opposite of generous is selfish.", ["", "\"Kind\" is close in meaning to generous.", "\"Giving\" means nearly the same as generous.", "\"Helpful\" is similar in meaning, not opposite."], "Choose the antonym."]];
const EKEY="brooke-eng-progress-v1";
let eprog={};try{eprog=JSON.parse(localStorage.getItem(EKEY)||"{}")||{}}catch(e){eprog={}}
const esave=()=>{try{localStorage.setItem(EKEY,JSON.stringify(eprog))}catch(e){}};
let eset=null;
ECATS.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+" ("+ENG.filter(x=>x[0]===c).length+")";$("eTopic").appendChild(o)});
function eStats(){const t=$("eTopic").value;const ids=ENG.map((x,i)=>i).filter(i=>t==="all"||ENG[i][0]===t);
  $("eStats").textContent=`${ids.filter(i=>eprog[i]==="right").length} of ${ids.length} ${t==="all"?"questions":t+" questions"} answered correctly`}
function newEngSet(onlyMissed){
  const t=$("eTopic").value;let pool=ENG.map((x,i)=>i).filter(i=>t==="all"||ENG[i][0]===t);
  if(onlyMissed){const miss=pool.filter(i=>eprog[i]==="wrong");if(miss.length)pool=miss}
  else{const fresh=pool.filter(i=>!eprog[i]),notRight=pool.filter(i=>eprog[i]!=="right");
    if(fresh.length>=10)pool=fresh;else if(notRight.length>=10)pool=notRight}
  eset={ids:shuffle(pool).slice(0,10),n:0,score:0,missed:[]};startTimer(eset,"e",renderEng);
}
const escH=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const engSent=s=>escH(s).replace(/\[(.*?)\]/,"<u>$1</u>");
function renderEng(){
  eStats();const b=$("eBody");
  if(!eset)newEngSet(false);
  if(eset.n>=eset.ids.length){
    const tt=$("eTopic").value;const anyMissed=ENG.some((x,i)=>eprog[i]==="wrong"&&(tt==="all"||x[0]===tt));
    b.innerHTML=`<div class="q"><div class="qnum">Set complete</div><div class="score">${eset.score}/${eset.ids.length}</div>${timeSummary(eset,"e")}
    ${eset.missed.length?`<div class="feedback">Review: ${eset.missed.map(i=>"<b>"+ENG[i][0]+"</b> · "+escH(ENG[i][1].replace(/[\[\]]/g,"")).slice(0,70)+"…").join("<br>")}</div>`:(eset.score===eset.ids.length?`<div class="qprompt">Perfect set.</div>`:"")}
    <div class="row" style="justify-content:flex-start"><button class="btn primary" id="eNew">New set of 10</button>${anyMissed?`<button class="btn" id="eRetry">Retry missed questions</button>`:""}</div></div>`;
    $("eNew").onclick=()=>{newEngSet(false);renderEng()};if(anyMissed)$("eRetry").onclick=()=>{newEngSet(true);renderEng()};return;
  }
  const id=eset.ids[eset.n],x=ENG[id],[cat,s,ch,ans,ex,why,q]=x,L=LETTERS[eset.n%2];
  const order=(ch[0]==="NO CHANGE"||ch[0]==="Correct as is")?[0,...shuffle([1,2,3])]:shuffle([0,1,2,3]);
  b.innerHTML=`<div class="q"><div class="row"><span class="qnum">Question ${eset.n+1} of ${eset.ids.length}</span><span class="row" style="gap:8px">${clockHTML(eset,"e")}<span class="mtag">${cat}</span></span></div>
  <div class="passage">${engSent(s)}</div>
  <div class="qprompt" style="font-size:16px">${q?escH(q):"Which choice is best for the underlined portion?"}</div>
  <div class="opts">${order.map((k,i)=>`<button class="opt" data-k="${k}"><span class="bub">${L[i]}</span><span>${escH(ch[k])}</span></button>`).join("")}</div>
  <div id="efb"></div></div>`;
  b.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const k=+btn.dataset.k,ok=k===ans;
    b.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===ans)o.classList.add("right")});
    eset.answered=(eset.answered||0)+1;logAct("e",ok);
    if(ok){eset.score++;eprog[id]="right"}else{btn.classList.add("wrong");eset.missed.push(id);eprog[id]="wrong"}
    esave();eStats();
    const others=[0,1,2,3].filter(j=>j!==ans&&j!==k);
    $("efb").innerHTML=`<div class="why">
      ${ok?"":`<div class="blk bad"><b class="h">Why “${escH(ch[k])}” is wrong</b>${escH(why[k])}</div>`}
      <div class="blk ok"><b class="h">${ok?"Correct.":"The right answer is “"+escH(ch[ans])+".”"} Here's why:</b>${escH(ex)}</div>
      <details ${ok?"":"open"}><summary>Why the ${ok?"other three choices are":"other wrong choices are"} wrong</summary><ul>${others.map(j=>`<li><b>${escH(ch[j])}:</b> ${escH(why[j])}</li>`).join("")}</ul></details>
    </div>
    <div style="margin-top:14px"><button class="btn primary" id="eNext">${eset.n+1<eset.ids.length?"Next question":"See results"}</button></div>`;
    $("eNext").onclick=()=>{eset.n++;renderEng()};$("eNext").focus();
  });
}
$("eTopic").onchange=()=>{eset=null;renderEng()};
$("mTimed").onchange=onTimedChange;$("eTimed").onchange=onTimedChange;syncTimed();

/* ---- tabs ---- */
function show(name){
  ["study","quiz","list","math","english","goals"].forEach(n=>{$("tab-"+n).setAttribute("aria-selected",n===name);const v=$("view-"+n);v.hidden=n!==name;if(n!=="quiz")v.style.display=n===name?"flex":"none"});
  if(name==="quiz"&&(!quiz||quiz.n>=quiz.items.length))startQuiz();
  if(name==="list")renderList();if(name==="study")buildDeck(false);if(name==="math")renderMath();if(name==="goals")renderGoals();if(name==="english")renderEng();
}
["study","quiz","list","math","english","goals"].forEach(n=>$("tab-"+n).onclick=()=>show(n));

updateStats();buildDeck(true);setTimeout(()=>syncNow(false),1500);
</script>
