<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3ee">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ACT Vocab Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: answer-sheet tint, one card at center, mode tabs on top, bubble answers like a real ACT form */
:root{
  --paper:#eef3ee; --sheet:#fbfdfb; --ink:#1f2622; --muted:#5d6a63; --rule:#c9d6cd;
  --pencil:#f2b705; --pencil-ink:#2a2000; --bubble:#2f3a34;
  --good:#1f7a4a; --good-bg:#dff1e6; --warn:#a84a12; --warn-bg:#fbe7d8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a17; --sheet:#1c2420; --ink:#e7eee9; --muted:#9aaaa1; --rule:#2f3b35;
  --pencil:#f2c53d; --pencil-ink:#221a00; --bubble:#c9d6cd;
  --good:#6fd39b; --good-bg:#16352a; --warn:#f0a06b; --warn-bg:#3a2516; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a17; --sheet:#1c2420; --ink:#e7eee9; --muted:#9aaaa1; --rule:#2f3b35;
  --pencil:#f2c53d; --pencil-ink:#221a00; --bubble:#c9d6cd;
  --good:#6fd39b; --good-bg:#16352a; --warn:#f0a06b; --warn-bg:#3a2516; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{background:var(--pencil);color:var(--pencil-ink);padding:0 .15em;border-radius:3px}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:16px;display:block}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
nav{display:flex;gap:6px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
nav button{font-family:var(--display);font-weight:700;font-size:15px;background:none;border:0;color:var(--muted);
  padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--pencil)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
select,input[type=search]{font:inherit;font-size:14px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* flashcard */
.scene{perspective:1400px}
.card{position:relative;min-height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;
  padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px;
  background-image:repeating-linear-gradient(var(--sheet) 0 31px,var(--rule) 31px 32px);background-position:0 18px}
.back{transform:rotateY(180deg)}
.word{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,58px);line-height:1;letter-spacing:-.02em;text-align:center;word-break:break-word}
.pos{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;position:absolute;bottom:14px;left:0;right:0}
.def{font-size:21px;font-weight:600;line-height:1.35;text-wrap:balance}
.ex{font-style:italic;color:var(--muted);max-width:60ch}
.ex mark{background:none;color:var(--ink);font-weight:600;font-style:normal;border-bottom:2px solid var(--pencil)}
.tag{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--rule);color:var(--ink)}
.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;border-radius:8px;padding:12px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn.learn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.btn.know{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.primary{background:var(--pencil);color:var(--pencil-ink);border-color:transparent}
.keys{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
@media (max-width:480px){.controls{grid-template-columns:1fr 1fr}.controls .nav{order:3}.face{padding:20px}.keys{display:none}}

/* quiz */
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.qprompt{font-size:19px;line-height:1.4}
.qprompt strong{font-family:var(--display);font-size:26px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;background:none;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--bubble)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bubble);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)} .opt.wrong .bub{background:var(--bubble);color:var(--sheet)}
.opt:disabled{cursor:default}
.feedback{font-size:15px;color:var(--muted)}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}

/* list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item p{margin:0;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--rule)}
.dot.known{background:var(--good);border-color:var(--good)} .dot.learning{background:var(--warn);border-color:var(--warn)}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.reset{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;text-decoration:underline;cursor:pointer}

/* math */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--display);font-weight:700;font-size:14px;background:var(--sheet);color:var(--muted);border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pencil);color:var(--pencil-ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.fcard{text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard .cat{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fcard h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
.fcard .fx{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.fcard .note{font-size:14px;color:var(--muted)}
.fcard .peek{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fcard.open{border-color:var(--pencil)}
.mtag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--rule)}
.work{border-left:3px solid var(--pencil);padding:4px 0 4px 12px;color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.6}

/* goals */
.goalhead{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px}
.goalhead .amt{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--rule);color:var(--ink)}
.pill.won{background:var(--good);color:var(--sheet)}
.goals{display:flex;flex-direction:column;gap:10px}
.goal{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal .gl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal b{font-family:var(--display);font-size:16px}
.goal .num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.goal.done{border-color:var(--good)} .goal.done .num{color:var(--good);font-weight:700}
.gbar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--pencil)}
.goal.done .gbar i{background:var(--good)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.day i{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:block}
.day.on i{background:var(--good);border-color:var(--good)} .day.today{color:var(--ink);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:6px 0}
.report{width:100%;min-height:200px;font-family:var(--mono);font-size:13px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px}
.exl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--muted);margin-bottom:2px}
.why{display:flex;flex-direction:column;gap:10px}
.why .blk{border-left:3px solid var(--rule);padding:2px 0 2px 12px;font-size:15px;line-height:1.5}
.why .blk.ok{border-color:var(--good)} .why .blk.bad{border-color:var(--warn)}
.why .blk b.h{display:block;font-family:var(--display);font-size:14px;margin-bottom:2px}
.why details{font-size:14px;color:var(--muted)} .why summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--ink)}
.why details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.qsent{font-style:italic;border-left:3px solid var(--pencil);padding-left:12px}
.tog{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 12px}
.tog input{width:18px;height:18px;accent-color:var(--good)}
.clock{font-family:var(--mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:var(--rule);color:var(--ink)}
.clock.low{background:var(--warn-bg);color:var(--warn)}
.passage{font-size:18px;line-height:1.6}
.passage u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--pencil);font-weight:600}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ACT <span>Vocab</span> Drill</h1>
      <div class="sub">Vocab · English · Math · <span id="total"></span> words</div>
    </div>
    <div class="stats">
      <div><b id="sKnown">0</b>mastered</div>
      <div><b id="sLearn">0</b>learning</div>
      <div><b id="sNew">0</b>new</div>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

  <nav role="tablist">
    <button role="tab" id="tab-study" aria-selected="true">Flashcards</button>
    <button role="tab" id="tab-quiz" aria-selected="false">Vocab quiz</button>
    <button role="tab" id="tab-list" aria-selected="false">Word list</button>
    <button role="tab" id="tab-math" aria-selected="false">Math</button>
    <button role="tab" id="tab-english" aria-selected="false">English</button>
    <button role="tab" id="tab-goals" aria-selected="false">Weekly goal</button>
  </nav>

  <!-- STUDY -->
  <section id="view-study" style="display:flex;flex-direction:column;gap:14px">
    <div class="row">
      <select id="deckFilter" aria-label="Which cards to study">
        <option value="all">All words</option>
        <option value="unknown">Not mastered yet</option>
        <option value="learning">Still learning only</option>
        <option value="new">New only</option>
      </select>
      <div class="row" style="gap:10px">
        <button class="btn" id="shuffleBtn" style="padding:8px 12px;font-size:13px">Shuffle</button>
        <span class="counter" id="cardCount"></span>
      </div>
    </div>
    <div class="scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
        <div class="face front">
          <span class="tag" id="fTag" hidden></span>
          <div class="word" id="fWord"></div>
          <div class="pos" id="fPos"></div>
          <div class="hint">Tap to see the definition</div>
        </div>
        <div class="face back">
          <div class="pos" style="text-align:left" id="bWord"></div>
          <div class="def" id="bDef"></div>
          <div class="ex" id="bEx"></div>
          <div class="ex" id="bFx"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn nav" id="prevBtn" aria-label="Previous card">←</button>
      <button class="btn learn" id="learnBtn">Still learning</button>
      <button class="btn know" id="knowBtn">Got it</button>
      <button class="btn nav" id="nextBtn" aria-label="Next card">→</button>
    </div>
    <div class="keys">Keyboard: Space flips · ← → move · 1 still learning · 2 got it</div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" hidden></section>

  <!-- LIST -->
  <section id="view-list" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <input type="search" id="search" placeholder="Search words or meanings" aria-label="Search words">
      <div class="legend">
        <span><i class="dot known"></i>mastered</span>
        <span><i class="dot learning"></i>learning</span>
        <span><i class="dot"></i>new</span>
        <button class="reset" id="resetBtn">Reset progress</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
<!-- GOALS -->
  <section id="view-goals" hidden style="flex-direction:column;gap:16px"></section>

  <!-- ENGLISH -->
  <section id="view-english" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <select id="eTopic" aria-label="English skill"><option value="all">All English skills</option></select>
      <label class="tog"><input type="checkbox" id="eTimed"> Timed (ACT pace)</label>
    </div>
    <div class="counter" id="eStats"></div>
    <div id="eBody"></div>
  </section>

  <!-- MATH -->
  <section id="view-math" hidden style="flex-direction:column;gap:14px">
    <div class="row">
      <div class="seg" role="group" aria-label="Math mode">
        <button id="mPractice" aria-pressed="true">Practice problems</button>
        <button id="mFormulas" aria-pressed="false">Formula cards</button>
      </div>
      <select id="mTopic" aria-label="Math topic"><option value="all">All ACT topics</option></select>
      <label class="tog"><input type="checkbox" id="mTimed"> Timed (ACT pace)</label>
    </div>
    <div class="counter" id="mStats"></div>
    <div id="mBody"></div>
  </section>
</div>

<script>
const WORDS = [
["abate", "verb", "to become less intense or widespread", "The quarterback waited for the crowd noise to abate before calling the snap.", "After forty days of rain, Noah waited for the flood waters to abate before leaving the ark."],
["aberration", "noun", "a departure from what is normal or expected", "The 4–0 loss was an aberration for a team that rarely concedes more than one goal.", "For someone who prays every morning, skipping a day felt like an aberration."],
["abhor", "verb", "to hate or detest strongly", "The coach seemed to abhor long throw-ins and banned them from practice.", "Scripture tells us to abhor what is evil and cling to what is good."],
["abstain", "verb", "to choose not to do or have something", "During preseason, the whole squad agreed to abstain from fast food and soda.", "Daniel chose to abstain from the king's rich food and stay faithful to God."],
["abundant", "adjective", "existing in large quantities; plentiful", "Chances were abundant in the first half, but nobody could finish.", "Jesus said he came so that we may have life and have it abundant and full."],
["accessible", "adjective", "easy to reach, use, or understand", "The coordinator kept the playbook accessible so freshmen could learn it quickly.", "The pastor kept his sermons accessible so even the youngest kids could follow."],
["acclaim", "noun", "enthusiastic public praise", "The young midfielder's debut earned acclaim from fans and critics alike.", "Jesus did not seek the crowd's acclaim; he often slipped away to pray alone."],
["accolade", "noun", "an award or expression of praise", "Winning the Heisman Trophy is the highest accolade in college football.", "The greatest accolade a believer can hope for is to hear, \"Well done, good and faithful servant.\""],
["acquiesce", "verb", "to accept or agree reluctantly, without protest", "The striker wanted to take the penalty, but he acquiesced when the captain grabbed the ball.", "Mary did not argue with the angel; she chose to acquiesce, saying, \"Let it be to me according to your word.\""],
["acute", "adjective", "severe and sudden; sharp", "He felt acute pain in his knee after the awkward tackle.", "Her acute awareness of others' needs made her the first to bring meals to grieving families."],
["adamant", "adjective", "refusing to change one's mind", "The coach was adamant that the freshman would start at quarterback.", "Shadrach, Meshach, and Abednego were adamant that they would not bow to the golden statue."],
["adept", "adjective", "very skilled or proficient", "The tight end is adept at finding soft spots in a zone defense.", "Our youth leader is adept at turning a hard Bible passage into a lesson anyone can understand."],
["adhere", "verb", "to stick to or follow closely", "Players must adhere to the team curfew during road trips.", "Ruth chose to adhere to Naomi, promising, \"Where you go, I will go.\""],
["adverse", "adjective", "harmful or unfavorable", "Adverse weather forced the officials to delay kickoff for an hour.", "Paul kept preaching even in adverse conditions: shipwrecks, prison, and hunger."],
["advocate", "verb", "to publicly support or recommend", "Many coaches advocate for more rest days between tournament games.", "Christians are called to advocate for the poor, the widow, and the orphan."],
["aesthetic", "adjective", "concerned with beauty or appearance", "The club changed its crest for aesthetic reasons, not because of any rule.", "The old church's stained glass is beautiful, but its purpose is more than aesthetic; each window tells a Bible story."],
["affable", "adjective", "friendly and easy to talk to", "The affable goalkeeper chatted with fans while signing autographs after every match.", "The affable greeter at church made every visitor feel like family."],
["alienate", "verb", "to make someone feel isolated or unwelcome", "Benching the captain without explanation could alienate the locker room.", "Jesus refused to alienate outsiders; he ate with tax collectors and sinners."],
["alleviate", "verb", "to make suffering or a problem less severe", "A strong running game can alleviate pressure on a young quarterback.", "The church's food pantry helps alleviate hunger in the neighborhood."],
["allude", "verb", "to refer to something indirectly", "The coach seemed to allude to the referee's mistakes without naming anyone.", "Many great novels allude to the parable of the prodigal son."],
["altruistic", "adjective", "showing selfless concern for others", "His altruistic pass to an open teammate set up the winning goal.", "The Good Samaritan's altruistic care for a stranger is a model for how to love our neighbor."],
["ambiguous", "adjective", "open to more than one interpretation; unclear", "The handball rule was so ambiguous that fans argued about every call.", "Jesus' command was not ambiguous: love one another as I have loved you."],
["ambivalent", "adjective", "having mixed or contradictory feelings", "He felt ambivalent about the transfer: excited about the bigger club, sad to leave his teammates.", "Jonah was ambivalent about God's mercy toward Nineveh; even after preaching there, he sulked when the city was spared."],

const STORE_KEY="act-vocab-progress-v1";
let progress={};
try{progress=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{}}catch(e){progress={}}
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(progress))}catch(e){}};
const status=w=>progress[w.w]||"new";
const $=id=>document.getElementById(id);

function updateStats(){
  let k=0,l=0;WORDS.forEach(w=>{const s=status(w);if(s==="known")k++;else if(s==="learning")l++});
  $("sKnown").textContent=k;$("sLearn").textContent=l;$("sNew").textContent=WORDS.length-k-l;
  $("barFill").style.width=(k/WORDS.length*100)+"%";$("total").textContent=WORDS.length;
}

/* ---- study ---- */
let deck=[],idx=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(doShuffle){
  const f=$("deckFilter").value;
  deck=WORDS.filter(w=>{const s=status(w);return f==="all"||(f==="unknown"&&s!=="known")||s===f});
  if(doShuffle)deck=shuffle(deck);idx=0;render();
}
function highlight(ex,word){
  const stem=word.length>5?word.slice(0,word.length-2):word;
  const re=new RegExp("\\b("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return esc(ex).replace(re,"<mark>$1</mark>");
}
function render(){
  const card=$("card");card.classList.remove("flipped");
  if(!deck.length){
    $("fWord").textContent="All done";$("fPos").textContent="No cards in this pile — pick another filter";
    $("fTag").hidden=true;$("cardCount").textContent="0 / 0";$("bDef").textContent="";$("bEx").textContent="";$("bFx").textContent="";$("bWord").textContent="";return;
  }
  const w=deck[idx];const s=status(w);
  $("fWord").textContent=w.w;$("fPos").textContent=w.p;
  $("fTag").hidden=s==="new";$("fTag").textContent=s==="known"?"mastered":"still learning";
  $("bWord").textContent=w.w+" · "+w.p;$("bDef").textContent=w.d;$("bEx").innerHTML=highlight(w.e,w.w);$("bFx").innerHTML=highlight(w.f,w.w);
  $("cardCount").textContent=(idx+1)+" / "+deck.length;
}
const flip=()=>$("card").classList.toggle("flipped");
const move=d=>{if(!deck.length)return;idx=(idx+d+deck.length)%deck.length;render()};
function mark(s){
  if(!deck.length)return;logAct("card");progress[deck[idx].w]=s;save();updateStats();
  const f=$("deckFilter").value;
  const stillFits=f==="all"||(f==="unknown"&&s!=="known")||f===s;
  if(!stillFits){deck.splice(idx,1);if(idx>=deck.length)idx=0;render()}else move(1);
}
$("card").onclick=flip;
$("card").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();flip()}};
$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);
$("learnBtn").onclick=()=>mark("learning");$("knowBtn").onclick=()=>mark("known");
$("shuffleBtn").onclick=()=>buildDeck(true);$("deckFilter").onchange=()=>buildDeck(true);
document.addEventListener("keydown",e=>{
  if($("view-study").hidden||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="1")mark("learning");else if(e.key==="2")mark("known");
});

/* ---- quiz ---- (ACT answer sheets alternate A–D on odd items, F–J on even) */
const LETTERS=[["A","B","C","D"],["F","G","H","J"]];
let quiz=null;
function startQuiz(){
  const weak=WORDS.filter(w=>status(w)!=="known");
  const pool=shuffle(weak.length>=10?weak:WORDS).slice(0,10);
  quiz={items:pool.map((w,i)=>{
    const sent=Math.random()<.5?w.e:w.f;
    const exact=new RegExp("\\b"+w.w+"\\b","i").test(sent);
    const type=(i%2&&exact)?"word":"def";
    const others=shuffle(WORDS.filter(x=>x.id!==w.id&&x.p===w.p)).slice(0,3);
    while(others.length<3){const x=WORDS[Math.floor(Math.random()*WORDS.length)];if(x.id!==w.id&&!others.includes(x))others.push(x)}
    return{w,type,sent,opts:shuffle([w,...others])}}),n:0,score:0,missed:[]};
  renderQ();
}
function renderQ(){
  const v=$("view-quiz");
  if(quiz.n>=quiz.items.length){
    const pct=Math.round(quiz.score/quiz.items.length*100);
    v.innerHTML=`<div class="q"><div class="qnum">Quiz complete</div><div class="score">${quiz.score}/${quiz.items.length}</div>
    <div class="qprompt">${pct>=90?"Excellent. These words are locked in.":pct>=70?"Solid work. Review the misses below.":"Keep going. The missed words were added to your Still learning pile."}</div>
    ${quiz.missed.length?`<div class="feedback"><b>Review:</b> ${quiz.missed.map(w=>`<b>${w.w}</b> (${w.d})`).join("; ")}</div>`:""}
    <div><button class="btn primary" id="again">Take another quiz</button></div></div>`;
    $("again").onclick=startQuiz;return;
  }
  const it=quiz.items[quiz.n],L=LETTERS[quiz.n%2];
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const blank=esc(it.sent).replace(new RegExp("\\b"+it.w.w+"\\b","i"),"_______");
  const prompt=it.type==="def"
    ?`<div class="qsent">${highlight(it.sent,it.w.w)}</div><div style="margin-top:10px">As it is used in the sentence above, the word <strong>${it.w.w}</strong> most nearly means:</div>`
    :`<div class="qsent">${blank}</div><div style="margin-top:10px">Which choice best completes the sentence?</div>`;
  v.innerHTML=`<div class="q"><div class="row"><span class="qnum">Question ${quiz.n+1} of ${quiz.items.length}</span><span class="counter">Score ${quiz.score}</span></div>
  <div class="qprompt">${prompt}</div>
  <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-id="${o.id}"><span class="bub">${L[i]}</span><span>${it.type==="def"?o.d:o.w}</span></button>`).join("")}</div>
  <div class="feedback" id="fb"></div></div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,it));
}
function answer(btn,it){
  const ok=+btn.dataset.id===it.w.id;
  $("view-quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.id===it.w.id)b.classList.add("right")});
  logAct("vq",ok);if(ok){quiz.score++}else{btn.classList.add("wrong");quiz.missed.push(it.w);progress[it.w.w]="learning";save();updateStats()}
  const pick=it.opts.find(o=>o.id===+btn.dataset.id);
  $("fb").innerHTML=`<div class="why">
    ${ok?"":`<div class="blk bad"><b class="h">Why your choice doesn't fit</b>${it.type==="def"?`That definition belongs to <b>${pick.w}</b>. It doesn't match how <b>${it.w.w}</b> is used here.`:`<b>${pick.w}</b> means “${pick.d}.” That meaning doesn't fit this sentence.`}</div>`}
    <div class="blk ok"><b class="h">${ok?"Correct:":"The answer:"} ${it.w.w} (${it.w.p})</b>${it.w.d}. Ask yourself whether the meaning makes sense in the sentence. If you swap it in for the word, the sentence should still read naturally.</div>
    <div class="blk"><span class="exl">Examples</span><i>${highlight(it.w.e,it.w.w)}</i><br><i>${highlight(it.w.f,it.w.w)}</i></div>
  </div><div style="margin-top:12px"><button class="btn primary" id="nextQ">${quiz.n+1<quiz.items.length?"Next question":"See results"}</button></div>`;
  $("nextQ").onclick=()=>{quiz.n++;renderQ()};$("nextQ").focus();
}

/* ---- list ---- */
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  $("list").innerHTML=WORDS.filter(w=>!q||w.w.includes(q)||w.d.toLowerCase().includes(q))
    .map(w=>`<div class="item"><h3>${w.w}<i class="dot ${status(w)}" title="${status(w)}"></i></h3><p><i>${w.p}</i> · ${w.d}</p></div>`).join("")
    ||`<p class="feedback">No words match “${q.replace(/</g,"&lt;")}”.</p>`;
}
$("search").oninput=renderList;
let resetArmed=false;
$("resetBtn").onclick=()=>{
  if(!resetArmed){resetArmed=true;$("resetBtn").textContent="Click again to confirm";setTimeout(()=>{resetArmed=false;$("resetBtn").textContent="Reset progress"},3000);return}
  progress={};save();updateStats();renderList();buildDeck(true);resetArmed=false;$("resetBtn").textContent="Reset progress";
};

["Number & Quantity", "What is the greatest common factor of 84 and 126?", ["42", "21", "14", "252"], 0, "84 = 2² · 3 · 7 and 126 = 2 · 3² · 7. Shared factors: 2 · 3 · 7 = 42.", {"21": "21 divides both numbers, but it isn't the greatest. 42 does too.", "14": "14 divides both numbers, but it isn't the greatest common factor.", "252": "That's the least common multiple, not the greatest common factor."}],
["Number & Quantity", "Two runners start a lap together. One finishes a lap every 12 seconds and the other every 18 seconds. After how many seconds are they first back at the start together?", ["36", "30", "216", "6"], 0, "This is the least common multiple of 12 and 18, which is 36.", {"30": "This adds 12 + 18. Look for the smallest number both 12 and 18 divide into.", "216": "12 × 18 is a common multiple, but not the least one.", "6": "That's the greatest common factor. The question needs a multiple of both lap times."}],
["Number & Quantity", "If x = 1/3, what is x⁻²?", ["9", "−9", "1/9", "−6"], 0, "x⁻² = 1/x² = 1/(1/9) = 9.", {"−9": "A negative exponent doesn't make the answer negative. It means take the reciprocal.", "1/9": "That's x². The negative exponent then flips it to 9.", "−6": "This multiplies the exponent by 3. x⁻² means 1/x²."}],
["Number & Quantity", "What is 27^(−1/3)?", ["1/3", "−3", "−9", "3"], 0, "∛27 = 3, and the negative exponent means take the reciprocal: 1/3.", {"−3": "A negative exponent doesn't make the answer negative. It means take the reciprocal.", "−9": "This multiplies 27 × (−1/3). Fractional exponents mean roots, not multiplication.", "3": "This takes the cube root but forgets the reciprocal from the negative exponent."}],
["Algebra", "What is the value of x that satisfies 2(x − 3) + 4 = 3x − 8?", ["6", "−6", "2", "10"], 0, "Distribute: 2x − 6 + 4 = 3x − 8, so 2x − 2 = 3x − 8. Subtract 2x and add 8: x = 6.", {"−6": "This is a sign error at the end. Check: 2(−6 − 3) + 4 = −14, but 3(−6) − 8 = −26.", "2": "Plug it in to check: 2(2 − 3) + 4 = 2, but 3(2) − 8 = −2. They don't match.", "10": "Plug it in to check: 2(10 − 3) + 4 = 18, but 3(10) − 8 = 22. They don't match."}],
["Algebra", "The formula d = rt relates distance, rate, and time. Which of the following expresses r in terms of d and t?", ["r = d/t", "r = dt", "r = t/d", "r = d − t"], 0, "Divide both sides by t.", {"r = dt": "This multiplies by t. To get r alone from d = rt, divide both sides by t.", "r = t/d": "The fraction is upside down. Check with d = 100 and t = 2: r should be 50, not 1/50.", "r = d − t": "This subtracts t. Since r and t are multiplied, undo that by dividing."}],
["Algebra", "If 2x + y = 11 and x − y = 1, what is y?", ["3", "4", "5", "7"], 0, "Add the equations: 3x = 12, so x = 4. Then 4 − y = 1, so y = 3.", {"4": "That's x, not y.", "5": "Check: if y = 5, then x = 6 from the second equation, and 2(6) + 5 = 17, not 11.", "7": "This subtracts 4 from 11. Find x first by adding the equations."}],
["Algebra", "A school sold 200 football tickets for $1,180. Adult tickets cost $8 and student tickets cost $5. How many adult tickets were sold?", ["60", "140", "80", "100"], 0, "Let a = adult tickets: 8a + 5(200 − a) = 1180, so 3a + 1000 = 1180, 3a = 180, a = 60.", {"140": "That's the number of student tickets. The question asks for adult tickets.", "80": "Check: 8(80) + 5(120) = $1,240, not $1,180.", "100": "Check: 8(100) + 5(100) = $1,300, not $1,180."}],
["Algebra", "Which of the following is equivalent to x² + 7x + 12?", ["(x + 3)(x + 4)", "(x + 2)(x + 6)", "(x + 1)(x + 12)", "(x − 3)(x − 4)"], 0, "Find two numbers that multiply to 12 and add to 7: 3 and 4.", {"(x + 2)(x + 6)": "2 × 6 = 12, but 2 + 6 = 8, not 7. You need numbers that multiply to 12 and add to 7.", "(x + 1)(x + 12)": "1 × 12 = 12, but 1 + 12 = 13, not 7.", "(x − 3)(x − 4)": "This gives −7x for the middle term. The original has +7x."}],
["Algebra", "Which of the following is the complete factorization of 2x² − 8?", ["2(x + 2)(x − 2)", "2(x − 2)²", "(2x + 4)(x − 2)", "2(x² − 4)"], 0, "Factor out 2: 2(x² − 4). Then x² − 4 is a difference of squares: 2(x + 2)(x − 2). The answer 2(x² − 4) is true but not fully factored.", {"2(x − 2)²": "Expanded, this is 2x² − 8x + 8, which has an extra middle term.", "(2x + 4)(x − 2)": "This multiplies out correctly, but it isn't complete: 2x + 4 still has a factor of 2.", "2(x² − 4)": "This is true but not complete. x² − 4 can still be factored as a difference of squares."}],
["Algebra", "What value of x satisfies √(x + 5) = 4?", ["11", "21", "−1", "3"], 0, "Square both sides: x + 5 = 16, so x = 11.", {"21": "This adds 5 instead of subtracting it: x + 5 = 16, so x = 11.", "−1": "This subtracts before squaring. Square both sides first: x + 5 = 16.", "3": "Check: √(3 + 5) = √8, which is not 4."}],
["Algebra", "What are all the real solutions of √(2x − 1) = x − 2?", ["5 only", "1 only", "1 and 5", "No solution"], 0, "Squaring gives 2x − 1 = x² − 4x + 4, so x² − 6x + 5 = 0 and x = 1 or 5. Check: x = 1 gives √1 = −1, which is false. x = 5 gives √9 = 3. Only 5 works.", {"1 only": "x = 1 is extraneous. √(2 − 1) = 1, but x − 2 = −1, and a square root can't equal a negative.", "1 and 5": "This forgets to check the answers. Squaring both sides can create a fake solution (x = 1).", "No solution": "x = 5 does work: √(10 − 1) = 3 and 5 − 2 = 3."}],
["Algebra", "What value of x satisfies 3^(x + 1) = 81?", ["3", "4", "27", "2"], 0, "81 = 3⁴, so x + 1 = 4 and x = 3.", {"4": "That's the value of x + 1. Subtract 1 to get x.", "27": "This divides 81 by 3. Write 81 as a power of 3 instead: 3⁴.", "2": "3³ = 27, not 81."}],
["Algebra", "What value of x satisfies 9^x = 27^(x − 2)?", ["6", "2", "−6", "3"], 0, "Rewrite with base 3: 3^(2x) = 3^(3x − 6). So 2x = 3x − 6 and x = 6.", {"2": "Check: 9² = 81, but 27⁰ = 1.", "−6": "This is a sign error. From 2x = 3x − 6, subtract 2x: 0 = x − 6, so x = 6.", "3": "Check: 9³ = 729, but 27¹ = 27."}],
["Algebra", "For x ≠ −3, which of the following is equivalent to (x² − 9)/(x + 3)?", ["x − 3", "x + 3", "x − 9", "x² − 3"], 0, "x² − 9 = (x + 3)(x − 3). Cancel (x + 3).", {"x + 3": "This cancels the wrong factor. (x + 3) is the factor that cancels, leaving x − 3.", "x − 9": "This cancels x's across terms. You can only cancel common factors, not pieces of a sum.", "x² − 3": "This divides only the 9 by 3. Factor the top first: (x + 3)(x − 3)."}],
["Algebra", "Which of the following is the solution set of 3 ≤ 2x + 1 < 9?", ["1 ≤ x < 4", "2 ≤ x < 5", "1 < x ≤ 4", "x ≥ 1"], 0, "Subtract 1 from all three parts: 2 ≤ 2x < 8. Divide by 2: 1 ≤ x < 4.", {"2 ≤ x < 5": "Check x = 4.5: 2(4.5) + 1 = 10, which is not less than 9.", "1 < x ≤ 4": "The inequality signs got switched. Keep ≤ and < in the same places.", "x ≥ 1": "This drops the upper limit. x must also be less than 4."}],
["Algebra", "What are the solutions of x² + 4x + 1 = 0?", ["−2 ± √3", "2 ± √3", "−4 ± √3", "−2 ± √5"], 0, "Quadratic formula: x = (−4 ± √(16 − 4))/2 = (−4 ± √12)/2 = (−4 ± 2√3)/2 = −2 ± √3.", {"2 ± √3": "The sign of −b is wrong. With b = 4, −b = −4.", "−4 ± √3": "This forgets to divide −4 by 2a = 2.", "−2 ± √5": "The discriminant is off. b² − 4ac = 16 − 4 = 12, not 20."}],
["Algebra", "How many real solutions does 2x² − 3x + 5 = 0 have?", ["0", "1", "2", "Infinitely many"], 0, "The discriminant is b² − 4ac = 9 − 40 = −31. It's negative, so there are no real solutions.", {"1": "There's exactly one real solution only when the discriminant is 0. Here it's −31.", "2": "Not every quadratic has two real roots. A negative discriminant means none.", "Infinitely many": "Infinitely many solutions happen only when an equation is true for every x. This one isn't."}],
["Algebra", "What is the sum of the solutions of x² − 9x + 14 = 0?", ["9", "14", "−9", "5"], 0, "Factor: (x − 2)(x − 7) = 0, so x = 2 or 7, and 2 + 7 = 9.", {"14": "That's the product of the solutions (2 × 7), not the sum.", "−9": "This is a sign error. For x² + bx + c, the sum of the roots is −b = 9.", "5": "That's the difference (7 − 2), not the sum."}],
["Algebra", "Which of the following is equivalent to (2x − 3)²?", ["4x² − 12x + 9", "4x² + 9", "4x² − 6x + 9", "4x² − 9"], 0, "(2x − 3)(2x − 3) = 4x² − 6x − 6x + 9 = 4x² − 12x + 9.", {"4x² + 9": "This forgets the middle term. (a − b)² = a² − 2ab + b².", "4x² − 6x + 9": "This includes only one of the two middle terms. There are two −6x terms.", "4x² − 9": "That's (2x + 3)(2x − 3), a difference of squares, not a square."}],
["Algebra", "What is the equation of the line through (1, 5) with slope −2?", ["y = −2x + 7", "y = −2x + 5", "y = −2x + 3", "y = 2x + 3"], 0, "y − 5 = −2(x − 1), so y = −2x + 2 + 5 = −2x + 7.", {"y = −2x + 5": "This uses the y-value 5 as the y-intercept. The point is (1, 5), not (0, 5).", "y = −2x + 3": "This is a sign error solving for b: 5 = −2(1) + b, so b = 7.", "y = 2x + 3": "The slope must be −2, not 2."}],
["Algebra", "A football camp charges a $150 registration fee plus $40 per day. A family paid $390 in total. How many days did the player attend?", ["6", "9", "4", "10"], 0, "150 + 40d = 390, so 40d = 240 and d = 6.", {"9": "This divides $390 by $40 and ignores the $150 fee.", "4": "Check: 150 + 40(4) = $310, not $390.", "10": "Check: 150 + 40(10) = $550, not $390."}],
["Algebra", "Which of the following is the solution set of |x − 3| < 5?", ["−2 < x < 8", "x < 8", "−8 < x < 2", "x < −2 or x > 8"], 0, "−5 < x − 3 < 5. Add 3: −2 < x < 8.", {"x < 8": "This keeps only one side. Absolute value less than 5 means between −5 and 5.", "−8 < x < 2": "This is a sign error. Add 3 to each part: −5 + 3 = −2 and 5 + 3 = 8.", "x < −2 or x > 8": "That's the solution to |x − 3| > 5. \"Less than\" gives a single interval in between."}],
["Algebra", "If 3/(x + 2) = 2/(x − 1), what is x?", ["7", "−7", "1", "5"], 0, "Cross-multiply: 3(x − 1) = 2(x + 2), so 3x − 3 = 2x + 4 and x = 7.", {"−7": "This is a sign error. From 3x − 3 = 2x + 4, x = 7.", "1": "x = 1 makes the denominator x − 1 equal to 0, so it can't be a solution.", "5": "Check: 3/7 does not equal 2/4."}],
["Functions", "If f(x) = 3x − 4 and f(a) = 11, what is a?", ["5", "29", "7/3", "3"], 0, "3a − 4 = 11, so 3a = 15 and a = 5.", {"29": "That's f(11). The question gives the output 11 and asks for the input.", "7/3": "This subtracts 4 instead of adding it: 3a = 11 + 4 = 15.", "3": "Check: f(3) = 9 − 4 = 5, not 11."}],
["Functions", "What is the domain of f(x) = √(x − 2)?", ["x ≥ 2", "x > 2", "x ≥ 0", "All real numbers"], 0, "The expression under the square root can't be negative, so x − 2 ≥ 0 and x ≥ 2.", {"x > 2": "This leaves out 2, but √(2 − 2) = √0 = 0 is fine.", "x ≥ 0": "The expression under the root is x − 2, not x. So x − 2 ≥ 0.", "All real numbers": "Numbers less than 2 put a negative under the square root, which isn't a real number."}],
["Functions", "What is the domain of f(x) = 1/(x − 5)?", ["All real numbers except 5", "All real numbers except 0", "x > 5", "All real numbers except −5"], 0, "You can't divide by zero, and x − 5 = 0 when x = 5.", {"All real numbers except 0": "The denominator is x − 5, which is 0 when x = 5, not when x = 0.", "x > 5": "Values less than 5 work fine, like x = 0, which gives −1/5.", "All real numbers except −5": "This is a sign error. x − 5 = 0 when x = +5."}],
["Functions", "If f(x) = 2x + 6, what is f⁻¹(x)?", ["(x − 6)/2", "2x − 6", "x/2 + 6", "1/(2x + 6)"], 0, "Swap x and y in y = 2x + 6: x = 2y + 6. Solve for y: y = (x − 6)/2.", {"2x − 6": "This flips the operation but not the order. Undo the steps in reverse: subtract 6, then divide by 2.", "x/2 + 6": "This undoes the steps in the wrong order. Subtract 6 first, then divide.", "1/(2x + 6)": "That's the reciprocal, not the inverse function."}],
["Functions", "f(x) = x² when x < 0, and f(x) = 2x + 1 when x ≥ 0. What is f(−3) + f(2)?", ["14", "4", "10", "−1"], 0, "f(−3) uses the first rule: (−3)² = 9. f(2) uses the second: 2(2) + 1 = 5. 9 + 5 = 14.", {"4": "Use the right rule for each input: −3 < 0, so f(−3) = (−3)² = 9. And 2 ≥ 0, so f(2) = 2(2) + 1 = 5.", "10": "Check each piece: f(−3) = 9 and f(2) = 5, so the sum is 14.", "−1": "This swaps the rules: 2(−3) + 1 = −5 and 2² = 4. Check which condition each input meets."}],
["Functions", "How does the graph of y = (x + 2)² − 5 compare to y = x²?", ["Shifted 2 left and 5 down", "Shifted 2 right and 5 down", "Shifted 2 left and 5 up", "Shifted 2 right and 5 up"], 0, "Inside the parentheses, +2 moves the graph left 2. The −5 outside moves it down 5. The vertex is (−2, −5).", {"Shifted 2 right and 5 down": "Inside the parentheses, the sign works backward: x + 2 moves the graph left.", "Shifted 2 left and 5 up": "Outside the parentheses, −5 moves the graph down.", "Shifted 2 right and 5 up": "Both directions are backward. +2 inside means left, and −5 outside means down."}],
["Functions", "What is the sum of the zeros of f(x) = (x − 1)(x + 4)(x − 6)?", ["3", "−3", "11", "24"], 0, "The zeros are 1, −4, and 6. Their sum is 1 − 4 + 6 = 3.", {"−3": "These are the signs from the factors, not the zeros. (x − 1) gives the zero x = 1.", "11": "This adds 1 + 4 + 6 and ignores that −4 is negative.", "24": "That's the product of 1, 4, and 6. The question asks for the sum."}],
["Functions", "A highlight video has 500 views and the number of views doubles every day. How many views will it have after 5 days?", ["16,000", "5,000", "2,500", "32,000"], 0, "500 · 2⁵ = 500 · 32 = 16,000.", {"5,000": "This multiplies 500 × 2 × 5, which is linear growth. Doubling multiplies by 2 each day: 500 × 2⁵.", "2,500": "This multiplies 500 by 5 days. Doubling compounds each day.", "32,000": "That's 6 doublings (500 × 2⁶). After 5 days there are only 5."}],
["Functions", "A team bus worth $20,000 loses 10% of its value each year. What is it worth after 2 years?", ["$16,200", "$16,000", "$18,000", "$14,000"], 0, "Each year it keeps 90%: 20,000 × 0.9 × 0.9 = 20,000 × 0.81 = $16,200.", {"$16,000": "This takes 20% off the original at once. Each year's 10% comes off the new, smaller value.", "$18,000": "That's the value after only 1 year.", "$14,000": "That's a 30% drop. Two years of 10% losses is 0.9 × 0.9 = 0.81 of the original."}],
["Functions", "What value of x satisfies log₂(x) = 6?", ["64", "12", "36", "8"], 0, "Rewrite in exponential form: x = 2⁶ = 64.", {"12": "This multiplies 6 × 2. log₂(x) = 6 means x = 2⁶.", "36": "This squares 6. The base is 2, so x = 2⁶ = 64.", "8": "2³ = 8, which would make log₂(x) = 3."}],
["Functions", "What is log₅(25) + log₅(5)?", ["3", "2", "log₅(30)", "5"], 0, "log₅(25) = 2 and log₅(5) = 1, so the sum is 3. (It also equals log₅(125) = 3.)", {"2": "That's only log₅(25). You still need to add log₅(5) = 1.", "log₅(30)": "Adding logs multiplies the inside: log₅(25 × 5) = log₅(125), not log₅(25 + 5).", "5": "This divides 25 by 5. Find each log separately: 2 + 1 = 3."}],
["Functions", "What is the average rate of change of f(x) = x² from x = 1 to x = 4?", ["5", "3", "15", "8"], 0, "(f(4) − f(1))/(4 − 1) = (16 − 1)/3 = 15/3 = 5.", {"3": "That's only the change in x. Rate of change = change in y ÷ change in x.", "15": "That's only the change in y (16 − 1). Divide it by the change in x, which is 3.", "8": "That's the slope right at x = 4, not the average from 1 to 4."}],
["Functions", "A punt's height in feet is h(t) = −16t² + 64t + 4, where t is seconds after the kick. What is its maximum height?", ["68 feet", "64 feet", "4 feet", "132 feet"], 0, "The vertex is at t = −b/(2a) = −64/(−32) = 2. h(2) = −64 + 128 + 4 = 68 feet.", {"64 feet": "This uses the coefficient 64 as the height. Plug the vertex time t = 2 into h(t).", "4 feet": "That's the starting height at t = 0, not the maximum.", "132 feet": "This is a sign error: −16(2²) is −64, not +64."}],
["Functions", "A soccer ball is kicked so its height in meters is h(t) = −5t² + 20t. After how many seconds does it land?", ["4", "2", "20", "5"], 0, "Set h(t) = 0: −5t(t − 4) = 0, so t = 0 (the kick) or t = 4 (the landing).", {"2": "That's when the ball reaches its highest point (the vertex), not when it lands.", "20": "That's just the coefficient of t. Set h(t) = 0 and solve.", "5": "Check: h(5) = −125 + 100 = −25, which is below the ground."}],
["Functions", "A linear function has f(0) = 3, f(1) = 7, and f(2) = 11. What is f(10)?", ["43", "40", "37", "47"], 0, "The slope is 4 (y goes up 4 each time x goes up 1), and the y-intercept is 3. f(x) = 4x + 3, so f(10) = 43.", {"40": "This forgets the starting value of 3: 4(10) + 3 = 43.", "37": "This swaps the slope and the intercept: 3(10) + 7.", "47": "This plugs in 11 instead of 10."}],
["Functions", "Which function has a period of π?", ["y = sin(2x)", "y = sin(x/2)", "y = 2 sin x", "y = sin x + 2"], 0, "The period of sin(bx) is 2π/b. For b = 2, that's π. Multiplying or adding outside doesn't change the period.", {"y = sin(x/2)": "The period of sin(bx) is 2π/b. Here b = 1/2, so the period is 4π.", "y = 2 sin x": "Multiplying outside changes the amplitude, not the period. The period stays 2π.", "y = sin x + 2": "Adding outside shifts the graph up. The period stays 2π."}],
["Functions", "What is the amplitude of y = −3 cos x + 1?", ["3", "−3", "1", "4"], 0, "Amplitude is the absolute value of the coefficient: |−3| = 3. The +1 shifts the graph up but doesn't change the amplitude.", {"−3": "Amplitude is a distance, so it's always positive: |−3| = 3.", "1": "That's the vertical shift, not the amplitude.", "4": "This adds the amplitude and the shift. Only the coefficient matters."}],
["Functions", "If f(x) = x² and g(x) = x − 3, what is f(g(x))?", ["(x − 3)²", "x² − 3", "x² − 9", "x − 9"], 0, "Put g(x) inside f: f(x − 3) = (x − 3)².", {"x² − 3": "That's g(f(x)). For f(g(x)), put g inside f.", "x² − 9": "(x − 3)² is not x² − 9. It's x² − 6x + 9.", "x − 9": "This mixes up the steps. Square the whole expression (x − 3)."}],
["Functions", "If f(x) = 2x² − x, what is f(x + 1)?", ["2x² + 3x + 1", "2x² + 3x + 3", "2x² − x + 1", "2x² + x"], 0, "2(x + 1)² − (x + 1) = 2x² + 4x + 2 − x − 1 = 2x² + 3x + 1.", {"2x² + 3x + 3": "This forgets to distribute the minus: −(x + 1) = −x − 1, not −x + 1.", "2x² − x + 1": "This adds 1 to f(x) instead of replacing x with x + 1. Check with x = 1: f(2) = 6, but this gives 2.", "2x² + x": "Check with x = 1: f(2) = 8 − 2 = 6, but this gives 3."}],
["Functions", "What is the range of f(x) = (x − 2)² + 3?", ["y ≥ 3", "y ≥ 2", "y ≤ 3", "All real numbers"], 0, "(x − 2)² is never negative, so the smallest value of f is 0 + 3 = 3.", {"y ≥ 2": "2 is the x-value of the vertex. The range uses the y-value, 3.", "y ≤ 3": "The parabola opens upward (positive x²), so y goes up from 3, not down.", "All real numbers": "The squared term is never negative, so y can never be below 3."}],
["Functions", "What is the sum of the first 20 terms of 3, 7, 11, 15, …?", ["820", "79", "830", "1,640"], 0, "The 20th term is 3 + 19(4) = 79. The sum is (20/2)(3 + 79) = 10 × 82 = 820.", {"79": "That's the 20th term, not the sum.", "830": "This uses 80 as the last term. The 20th term is 3 + 19(4) = 79.", "1,640": "This forgets to divide by 2 in the sum formula (n/2)(first + last)."}],
["Geometry", "An 8-foot goalpost casts a 12-foot shadow. At the same time, a player casts a 9-foot shadow. How tall is the player?", ["6 feet", "13.5 feet", "5 feet", "7 feet"], 0, "The triangles are similar: 8/12 = h/9, so h = 72/12 = 6 feet.", {"13.5 feet": "This flips the ratio. Height/shadow must match: 8/12 = h/9.", "5 feet": "This subtracts (9 − 4). Similar triangles use ratios, not differences.", "7 feet": "Check: 7/9 ≈ 0.78, but 8/12 ≈ 0.67. The ratios must be equal."}],
["Geometry", "An angle measures 65°. What is the measure of its supplement?", ["115°", "25°", "295°", "35°"], 0, "Supplementary angles add to 180°: 180 − 65 = 115°.", {"25°": "That's the complement, which adds to 90°. A supplement adds to 180°.", "295°": "This subtracts from 360°. Supplements add to 180°.", "35°": "This subtracts from 100°. Supplements add to 180°."}],
["Geometry", "Two parallel lines are cut by a transversal. Two alternate interior angles measure (3x + 10)° and (5x − 30)°. What is x?", ["20", "10", "25", "40"], 0, "Alternate interior angles are equal: 3x + 10 = 5x − 30, so 40 = 2x and x = 20.", {"10": "Check: 3(10) + 10 = 40, but 5(10) − 30 = 20.", "25": "Check: 3(25) + 10 = 85, but 5(25) − 30 = 95.", "40": "This forgets to divide by 2. From 40 = 2x, x = 20."}],
["Geometry", "Two angles of a triangle measure 40° and 75°. What is the third angle?", ["65°", "115°", "55°", "75°"], 0, "The angles of a triangle add to 180°: 180 − 40 − 75 = 65°.", {"115°": "That's the sum of the two given angles. Subtract it from 180°.", "55°": "This is an arithmetic slip: 180 − 40 − 75 = 65.", "75°": "This assumes the triangle is isosceles. Nothing in the problem says it is."}],
["Geometry", "The vertex angle of an isosceles triangle is 40°. What is each base angle?", ["70°", "40°", "140°", "50°"], 0, "The two base angles are equal: (180 − 40)/2 = 70°.", {"40°": "This assumes all the angles are equal. Only the two base angles match.", "140°": "That's what's left for both base angles together. Split it in half.", "50°": "This subtracts from 90°. A triangle's angles add to 180°."}],
["Geometry", "An equipment box is 5 ft long, 4 ft wide, and 3 ft high. What is its total surface area?", ["94 ft²", "60 ft²", "47 ft²", "120 ft²"], 0, "2(lw + lh + wh) = 2(20 + 15 + 12) = 2(47) = 94 ft².", {"60 ft²": "That's the volume (5 × 4 × 3), not the surface area.", "47 ft²": "That's three faces. A box has six faces, so double it.", "120 ft²": "That's twice the volume. Surface area adds the face areas."}],
["Geometry", "A cone has radius 3 and height 8. What is its volume?", ["24π", "72π", "48π", "8π"], 0, "V = (1/3)πr²h = (1/3)π(9)(8) = 24π.", {"72π": "That's the volume of a cylinder. A cone is 1/3 of it.", "48π": "This uses 2/3 instead of 1/3.", "8π": "This forgets to square the radius."}],
["Geometry", "A ball has a radius of 3 inches. What is its volume?", ["36π in³", "12π in³", "27π in³", "108π in³"], 0, "V = (4/3)πr³ = (4/3)π(27) = 36π in³.", {"12π in³": "This squares the radius instead of cubing it.", "27π in³": "This forgets the 4/3.", "108π in³": "This uses 4 instead of 4/3."}],
["Geometry", "A circle has radius 10. How long is the arc cut off by a 72° central angle?", ["4π", "20π", "2π", "10π"], 0, "72/360 = 1/5 of the circle. The circumference is 20π, and (1/5)(20π) = 4π.", {"20π": "That's the whole circumference. The arc is only 72/360 = 1/5 of it.", "2π": "This uses 1/10 of the circle. 72° is 1/5 of 360°.", "10π": "That's half the circle. 72° is 1/5 of the way around."}],
["Geometry", "What is the area of a 90° sector of a circle with radius 6?", ["9π", "36π", "3π", "18π"], 0, "90° is 1/4 of the circle: (1/4)π(6²) = 9π.", {"36π": "That's the area of the whole circle. 90° is only 1/4 of it.", "3π": "That's the arc length (1/4 of 12π), not the sector's area.", "18π": "That's half the circle. 90° is a quarter."}],
["Geometry", "What are the center and radius of (x − 2)² + (y + 5)² = 49?", ["Center (2, −5), radius 7", "Center (−2, 5), radius 7", "Center (2, −5), radius 49", "Center (2, 5), radius 7"], 0, "The form is (x − h)² + (y − k)² = r². Here h = 2, k = −5, and r = √49 = 7.", {"Center (−2, 5), radius 7": "Both signs are flipped. (x − 2) means h = +2, and (y + 5) means k = −5.", "Center (2, −5), radius 49": "49 is r². The radius is √49 = 7.", "Center (2, 5), radius 7": "The y-sign is flipped. y + 5 = y − (−5), so k = −5."}],
["Geometry", "What is the radius of the circle x² + y² − 6x + 4y − 12 = 0?", ["5", "12", "25", "√12"], 0, "Complete the square: (x − 3)² + (y + 2)² = 12 + 9 + 4 = 25. The radius is √25 = 5.", {"12": "That's the right side before completing the square. Add 9 and 4 to get r² = 25.", "25": "That's r². The radius is √25 = 5.", "√12": "This skips completing the square. You must add 9 and 4 to both sides."}],
["Geometry", "What is the length of the major axis of the ellipse x²/25 + y²/9 = 1?", ["10", "5", "6", "25"], 0, "The larger denominator is a² = 25, so a = 5. The major axis is 2a = 10.", {"5": "That's half the major axis (a). The full axis is 2a.", "6": "That's the minor axis, 2b = 2 × 3.", "25": "That's a². Take the root, then double it."}],
["Geometry", "In a triangle, two sides measure 5 and 8 and the angle between them is 60°. How long is the third side?", ["7", "√89", "13", "9"], 0, "Law of cosines: c² = 25 + 64 − 2(5)(8)cos 60° = 89 − 40 = 49, so c = 7.", {"√89": "This leaves out −2ab cos C, which only works for a right angle. Here the angle is 60°.", "13": "This adds the sides. A triangle's third side is always shorter than the sum of the other two.", "9": "Check: 9² = 81, but c² = 89 − 40 = 49."}],
["Geometry", "In triangle ABC, angle A = 30°, angle B = 90°, and side a (opposite A) = 10. How long is side b (opposite B)?", ["20", "10√3", "5", "10√2"], 0, "Law of sines: b/sin 90° = 10/sin 30°, so b = 10 × 1/(1/2) = 20.", {"10√3": "That's the other leg, side c. Side b is opposite the 90° angle, so it's the hypotenuse.", "5": "This multiplies by sin 30° instead of dividing. The hypotenuse must be longer than 10.", "10√2": "That's for a 45-45-90 triangle. This one is 30-60-90."}],
["Geometry", "What is 135° in radians?", ["3π/4", "2π/3", "5π/4", "3π/2"], 0, "Multiply by π/180: 135 × π/180 = 3π/4.", {"2π/3": "That's 120°. Check: 135 × π/180 = 3π/4.", "5π/4": "That's 225°.", "3π/2": "That's 270°."}],
["Geometry", "What is cos(2π/3)?", ["−1/2", "1/2", "−√3/2", "√3/2"], 0, "2π/3 is 120°, in quadrant II where cosine is negative. The reference angle is 60°, and cos 60° = 1/2.", {"1/2": "This drops the sign. 2π/3 (120°) is in quadrant II, where cosine is negative.", "−√3/2": "That's cos(5π/6), at 150°. The reference angle for 120° is 60°.", "√3/2": "That's sin(2π/3). Cosine at 120° is −1/2."}],
["Geometry", "A right triangle has legs 8 and 15. What is the sine of the angle opposite the side of length 8?", ["8/17", "8/15", "15/17", "17/8"], 0, "The hypotenuse is √(64 + 225) = 17. sin = opposite/hypotenuse = 8/17.", {"8/15": "That's the tangent (opposite/adjacent). Sine is opposite/hypotenuse.", "15/17": "That's the sine of the other acute angle.", "17/8": "That's hypotenuse/opposite. Sine can't be greater than 1."}],
["Geometry", "Which of these does NOT prove two triangles are congruent?", ["SSA", "SAS", "ASA", "SSS"], 0, "SSS, SAS, and ASA all guarantee congruence. SSA can fit two different triangles.", {"SAS": "SAS does prove congruence: two sides and the angle between them.", "ASA": "ASA does prove congruence: two angles and the side between them.", "SSS": "SSS does prove congruence: all three sides match."}],
["Geometry", "What is the measure of each exterior angle of a regular octagon?", ["45°", "135°", "60°", "40°"], 0, "The exterior angles of any polygon add to 360°: 360/8 = 45°.", {"135°": "That's the interior angle. Exterior angles are 180° − 135° = 45°.", "60°": "That's a regular hexagon's exterior angle (360/6).", "40°": "That's a nine-sided polygon's exterior angle (360/9)."}],
["Geometry", "How long is the diagonal of a square with side length 6?", ["6√2", "12", "6√3", "36"], 0, "The diagonal makes a 45-45-90 triangle, so it's side × √2 = 6√2.", {"12": "This adds two sides. The diagonal is the hypotenuse: √(6² + 6²).", "6√3": "That's the diagonal of a cube, not a square.", "36": "That's the area, not the diagonal."}],
["Statistics & Probability", "What is the range of the data set 4, 9, 15, 22, 30?", ["26", "16", "15", "34"], 0, "Range = maximum − minimum = 30 − 4 = 26.", {"16": "Range = maximum − minimum = 30 − 4. Make sure you use the largest and smallest values.", "15": "That's the median.", "34": "This adds 30 + 4. Range subtracts."}],
["Statistics & Probability", "What is the mode of 3, 5, 5, 7, 8, 8, 8, 10?", ["8", "5", "6.75", "7"], 0, "8 appears three times, more than any other value.", {"5": "5 appears twice, but 8 appears three times.", "6.75": "That's the mean (54 ÷ 8). Mode means the most frequent value.", "7": "7 appears only once. Mode means the most frequent value."}],
["Statistics & Probability", "A player's goal totals over five seasons are 10, 12, 14, 16, 18. A sixth season of 50 goals is added. What is the new mean?", ["20", "14", "15", "25"], 0, "The new total is 70 + 50 = 120, and 120 ÷ 6 = 20. (The outlier pulls the mean up much more than the median, which only moves to 15.)", {"14": "That's the old mean, before adding the 50-goal season.", "15": "That's the new median. The mean is pulled up much more by the outlier.", "25": "This halves 50. Add all six seasons and divide by 6."}],
["Statistics & Probability", "What is the interquartile range of 2, 4, 6, 8, 10, 12, 14, 16?", ["8", "14", "6", "10"], 0, "Lower half 2, 4, 6, 8 has median Q1 = 5. Upper half 10, 12, 14, 16 has median Q3 = 13. IQR = 13 − 5 = 8.", {"14": "That's the full range (16 − 2), not the interquartile range.", "6": "This uses the wrong quartile values. Q1 = 5 and Q3 = 13.", "10": "This uses 4 and 14 as quartiles. Take the median of each half instead."}],
["Statistics & Probability", "Which data set has the largest standard deviation?", ["1, 5, 15, 19", "10, 10, 10, 10", "8, 9, 11, 12", "9, 10, 10, 11"], 0, "All four sets have a mean of 10. Standard deviation measures spread, and 1, 5, 15, 19 is spread farthest from 10.", {"10, 10, 10, 10": "No spread at all, so its standard deviation is 0.", "8, 9, 11, 12": "Every value is within 2 of the mean, which is a small spread.", "9, 10, 10, 11": "These are the most tightly clustered of all."}],
["Statistics & Probability", "In a survey of 100 students, 35 boys and 25 girls play a sport, and 15 boys and 25 girls do not. If a student who plays a sport is chosen at random, what is the probability the student is a girl?", ["5/12", "1/4", "1/2", "5/8"], 0, "Only look at the 35 + 25 = 60 students who play a sport. 25 of them are girls: 25/60 = 5/12.", {"1/4": "This uses all 100 students. The question says the student plays a sport, so use only those 60.", "1/2": "This uses all 50 girls. Restrict to the 60 students who play a sport.", "5/8": "This divides by 40 (the students who don't play). The condition is students who play."}],
["Statistics & Probability", "In the same survey (35 boys and 25 girls play a sport; 15 boys and 25 girls don't), what is the probability that a randomly chosen student is a boy who does not play a sport?", ["3/20", "3/10", "1/4", "3/8"], 0, "15 of the 100 students are boys who don't play a sport: 15/100 = 3/20.", {"3/10": "This divides by the 50 boys. No condition was given, so divide by all 100 students.", "1/4": "That's girls who don't play (25/100).", "3/8": "This divides by the 40 non-players. Divide by all 100."}],
["Statistics & Probability", "A kicker makes 80% of his extra points, and each kick is independent. What is the probability he makes two in a row?", ["0.64", "0.80", "1.60", "0.40"], 0, "Multiply independent probabilities: 0.8 × 0.8 = 0.64.", {"0.80": "That's one kick. Two independent kicks multiply: 0.8 × 0.8.", "1.60": "This adds the probabilities. A probability can never be more than 1.", "0.40": "This halves 0.8. Multiply for \"and\": 0.8 × 0.8."}],
["Statistics & Probability", "A fair coin is flipped 3 times. What is the probability of getting at least one head?", ["7/8", "1/2", "3/8", "1/8"], 0, "The only way to get no heads is TTT, with probability 1/8. So P(at least one head) = 1 − 1/8 = 7/8.", {"1/2": "That's the chance of a head on one flip.", "3/8": "That's exactly one head. \"At least one\" also counts two and three heads.", "1/8": "That's the chance of no heads (TTT). Subtract it from 1."}],
["Statistics & Probability", "In a raffle, you have a 1/4 chance to win $20 and a 3/4 chance to win $4. What is the expected value of your prize?", ["$8", "$12", "$24", "$6"], 0, "EV = (1/4)(20) + (3/4)(4) = 5 + 3 = $8.", {"$12": "This averages $20 and $4 as if they were equally likely. Weight each prize by its probability.", "$24": "This adds the prizes. Multiply each by its probability, then add.", "$6": "Check: (1/4)(20) = 5 and (3/4)(4) = 3, so the total is 8."}],
["Statistics & Probability", "A coach must choose the order of 5 penalty takers. How many different orders are possible?", ["120", "25", "5", "60"], 0, "5! = 5 × 4 × 3 × 2 × 1 = 120.", {"25": "This uses 5 × 5. After one taker is chosen, only 4 are left for the next spot.", "5": "That's only the first spot. Multiply 5 × 4 × 3 × 2 × 1.", "60": "This orders only 3 of the takers (5 × 4 × 3). All 5 need an order."}],
["Statistics & Probability", "How many ways can a coach choose 3 players from 8 to attend a captains' meeting?", ["56", "336", "24", "11"], 0, "Order doesn't matter: 8C3 = (8 × 7 × 6)/(3 × 2 × 1) = 56. (336 counts each group in every order.)", {"336": "This counts order (8 × 7 × 6). A group of 3 is the same in any order, so divide by 3! = 6.", "24": "This multiplies 8 × 3. Use combinations: 8C3.", "11": "This adds 8 + 3. Use combinations: 8C3."}],
["Statistics & Probability", "A player has 3 jerseys, 4 pairs of shorts, and 2 pairs of socks. How many different outfits can he make?", ["24", "9", "12", "48"], 0, "Multiply the choices: 3 × 4 × 2 = 24.", {"9": "This adds the choices. Multiply them: 3 × 4 × 2.", "12": "This forgets the socks.", "48": "This doubles the correct count. 3 × 4 × 2 = 24."}],
["Statistics & Probability", "The line of best fit for practice hours per week (x) and free-throw percentage (y) is y = 3x + 40. What does it predict for 10 hours of practice?", ["70%", "43%", "30%", "50%"], 0, "y = 3(10) + 40 = 70.", {"43%": "This adds 3 + 40 and forgets to multiply 3 by 10 hours.", "30%": "This forgets to add the 40.", "50%": "This adds 40 + 10. The slope 3 multiplies the hours."}],
["Statistics & Probability", "Which method gives the least biased sample of students at a school?", ["Randomly selecting 50 names from the full school roster", "Surveying the first 50 students at football practice", "Asking students to volunteer online", "Surveying one homeroom class"], 0, "A random sample from the whole population gives everyone an equal chance. The others over-represent certain groups.", {"Surveying the first 50 students at football practice": "That samples only athletes, so it isn't representative.", "Asking students to volunteer online": "Volunteers choose themselves, so the sample is biased toward people who want to respond.", "Surveying one homeroom class": "One class represents just one grade or group, not the whole school."}],
["Statistics & Probability", "A correlation coefficient of r = −0.92 describes which relationship?", ["Strong negative linear relationship", "Weak negative linear relationship", "Strong positive linear relationship", "No relationship"], 0, "The sign gives the direction (negative), and a value close to −1 means a strong linear fit.", {"Weak negative linear relationship": "−0.92 is close to −1, so the relationship is strong, not weak.", "Strong positive linear relationship": "The negative sign means one variable goes down as the other goes up.", "No relationship": "That would be r near 0. Here r = −0.92."}],
["Statistics & Probability", "One class of 20 students averages 75 on a test, and another class of 30 averages 85. What is the average of all 50 students?", ["81", "80", "82", "79"], 0, "Weighted mean: (20 × 75 + 30 × 85)/50 = (1500 + 2550)/50 = 4050/50 = 81.", {"80": "This averages 75 and 85 as if the classes were the same size. The larger class pulls the average toward 85.", "82": "Check: (20 × 75 + 30 × 85) ÷ 50 = 4,050 ÷ 50 = 81.", "79": "This swaps the weights, giving the 30 students a 75. Match each average to its class."}],
["Essential Skills", "12 bottles of Gatorade cost $15. At the same rate, how much do 20 bottles cost?", ["$25", "$16", "$30", "$23"], 0, "$15 ÷ 12 = $1.25 per bottle, and 20 × $1.25 = $25.", {"$16": "This adds $1. Find the cost of one bottle first: $15 ÷ 12 = $1.25.", "$30": "This doubles the price, but 20 bottles isn't double 12.", "$23": "This adds $8 (20 − 12). Proportions multiply; they don't add."}],
["Essential Skills", "On a map, 1 inch represents 50 miles. Two cities are 3.5 inches apart on the map. What is the real distance?", ["175 miles", "53.5 miles", "150 miles", "14.3 miles"], 0, "3.5 × 50 = 175 miles.", {"53.5 miles": "This adds 50 + 3.5. Multiply instead.", "150 miles": "This uses only 3 inches. Don't drop the half inch.", "14.3 miles": "This divides 50 by 3.5. Multiply the inches by miles per inch."}],
["Essential Skills", "What is 35% of 80?", ["28", "45", "2.8", "228.6"], 0, "0.35 × 80 = 28.", {"45": "This subtracts 80 − 35. Find 35% by multiplying: 0.35 × 80.", "2.8": "The decimal is misplaced. 35% = 0.35, not 0.035.", "228.6": "This divides 80 by 0.35. \"Of\" means multiply."}],
["Essential Skills", "Cleats cost $120. They're 25% off, and then 8% sales tax is added. What is the final price?", ["$97.20", "$90.00", "$99.60", "$83.00"], 0, "25% off: 120 × 0.75 = $90. Add tax: 90 × 1.08 = $97.20.", {"$90.00": "That's the sale price before the 8% tax.", "$99.60": "This figures the tax on the original $120 instead of the sale price.", "$83.00": "This subtracts the tax instead of adding it, which gives about $82.80. Tax raises the price: 90 × 1.08."}],
["Essential Skills", "A jersey's price is raised 20%, and then the new price is cut 20%. How does the final price compare to the original?", ["4% lower", "The same", "4% higher", "2% lower"], 0, "1.20 × 0.80 = 0.96, so the final price is 96% of the original, which is 4% lower.", {"The same": "The 20% cut is taken from a bigger number than the 20% increase, so you end up lower.", "4% higher": "The direction is backward. 1.2 × 0.8 = 0.96, which is lower.", "2% lower": "Check: 1.20 × 0.80 = 0.96, which is 4% lower, not 2%."}],
["Essential Skills", "40 is what percent of 250?", ["16%", "6.25%", "62.5%", "10%"], 0, "40 ÷ 250 = 0.16 = 16%.", {"6.25%": "This divides 250 by 40. Divide the part by the whole: 40 ÷ 250.", "62.5%": "This divides 25 by 40. Divide the part by the whole: 40 ÷ 250.", "10%": "Check: 10% of 250 is 25, not 40."}],
["Essential Skills", "A team bus travels 180 miles in 3 hours 45 minutes. What is its average speed?", ["48 mph", "60 mph", "45 mph", "50 mph"], 0, "3 hours 45 minutes = 3.75 hours. 180 ÷ 3.75 = 48 mph.", {"60 mph": "This ignores the 45 minutes and uses 3 hours.", "45 mph": "This rounds up to 4 hours. 45 minutes is 0.75 hours.", "50 mph": "45 minutes is 0.75 hours, not 0.6. Use 3.75 hours."}],
["Essential Skills", "A sprinter runs 100 meters in 12.5 seconds. What is that speed in kilometers per hour?", ["28.8 km/h", "8 km/h", "480 km/h", "2.2 km/h"], 0, "100/12.5 = 8 m/s. Multiply by 3600 s/h and divide by 1000 m/km: 8 × 3.6 = 28.8 km/h.", {"8 km/h": "That's meters per second. Multiply by 3.6 to get km/h.", "480 km/h": "That's meters per minute (8 × 60). Convert to km/h.", "2.2 km/h": "This divides by 3.6 instead of multiplying."}],
["Essential Skills", "An American football field, including end zones, is 120 yards long and 53⅓ yards wide. What is its area?", ["6,400 square yards", "6,000 square yards", "346⅔ square yards", "6,360 square yards"], 0, "120 × 53⅓ = 120 × 160/3 = 6,400 square yards.", {"6,000 square yards": "This rounds 53⅓ down to 50.", "346⅔ square yards": "That's the perimeter, not the area.", "6,360 square yards": "This drops the ⅓: 120 × 53 = 6,360. The extra ⅓ adds 40 more."}],
["Essential Skills", "A soccer pitch is 105 meters long and 68 meters wide. What is its perimeter?", ["346 m", "173 m", "7,140 m", "278 m"], 0, "P = 2(105 + 68) = 2(173) = 346 m.", {"173 m": "That's half the perimeter. There are two lengths and two widths.", "7,140 m": "That's the area, not the perimeter.", "278 m": "This counts only one width: 2(105) + 68."}],
["Essential Skills", "A figure is a 10-by-6 rectangle with a semicircle attached to one 6-unit side. What is its total area?", ["60 + 4.5π", "60 + 9π", "60 + 36π", "60 + 3π"], 0, "The semicircle has radius 3, so its area is (1/2)π(3²) = 4.5π. Add the rectangle's 10 × 6 = 60.", {"60 + 9π": "That's a full circle of radius 3. The shape has only a semicircle.", "60 + 36π": "This uses 6 as the radius. 6 is the diameter, so r = 3.", "60 + 3π": "That's half the circumference (an arc length), not an area."}],
["Essential Skills", "A bus drives 60 miles at 30 mph and then 60 more miles at 60 mph. What is its average speed for the whole trip?", ["40 mph", "45 mph", "50 mph", "35 mph"], 0, "Time = 60/30 + 60/60 = 2 + 1 = 3 hours. Average speed = 120 miles ÷ 3 hours = 40 mph. (Averaging 30 and 60 to get 45 is the trap.)", {"45 mph": "This averages the speeds. The bus spends more time going 30 mph, so the average is lower.", "50 mph": "Average speed is total distance ÷ total time: 120 ÷ 3.", "35 mph": "Check: 120 miles ÷ 3 hours = 40 mph."}],
["Essential Skills", "A student scored 82, 90, and 78 on three tests. What does she need on the fourth test to average 85?", ["90", "85", "88", "95"], 0, "She needs a total of 4 × 85 = 340. She has 82 + 90 + 78 = 250, so she needs 340 − 250 = 90.", {"85": "Her total would be 335, and 335 ÷ 4 = 83.75. She needs more than 85.", "88": "Check: (250 + 88) ÷ 4 = 84.5, which is short of 85.", "95": "Check: (250 + 95) ÷ 4 = 86.25, which is more than she needs."}],
["Essential Skills", "What is the median of 11, 3, 8, 15, 6?", ["8", "11", "8.6", "6"], 0, "Sort first: 3, 6, 8, 11, 15. The middle value is 8.", {"11": "This picks the middle of the unsorted list. Sort first: 3, 6, 8, 11, 15.", "8.6": "That's the mean (43 ÷ 5), not the median.", "6": "That's the 2nd value after sorting. The middle of 5 values is the 3rd."}],
["Essential Skills", "Which of the following is equal to 0.00045?", ["4.5 × 10⁻⁴", "4.5 × 10⁴", "4.5 × 10⁻⁵", "4.5 × 10⁻³"], 0, "Move the decimal 4 places right to get 4.5. Moving it right means the exponent is negative: 10⁻⁴.", {"4.5 × 10⁴": "The exponent's sign is wrong. Small numbers have negative exponents.", "4.5 × 10⁻⁵": "This counts 5 places. The decimal moves 4 places to get to 4.5.", "4.5 × 10⁻³": "This counts 3 places. The decimal moves 4 places."}],
["Essential Skills", "A sports drink mix uses 3 scoops of powder for every 2 gallons of water. How many scoops are needed for a 10-gallon cooler?", ["15", "20", "6.7", "30"], 0, "3/2 = x/10, so x = 30/2 = 15 scoops.", {"20": "This multiplies 10 by 2. The ratio is 3 scoops per 2 gallons.", "6.7": "The ratio is upside down. Use 3/2 = x/10, not 2/3 = x/10.", "30": "This multiplies 10 by 3. That would be 3 scoops for every gallon."}],
["Essential Skills", "One hose fills the team's ice tub in 6 hours and a second hose fills it in 3 hours. How long do the two hoses take working together?", ["2 hours", "4.5 hours", "9 hours", "1.5 hours"], 0, "Rates add: 1/6 + 1/3 = 1/6 + 2/6 = 1/2 tub per hour. So it takes 2 hours.", {"4.5 hours": "This averages the times. Two hoses together must be faster than either one alone.", "9 hours": "This adds the times. Working together should take less time, not more.", "1.5 hours": "This halves the faster time. That would require two hoses as fast as the 3-hour hose."}],
["Essential Skills", "How much simple interest does $2,000 earn at 5% per year for 3 years?", ["$300", "$100", "$315.25", "$3,000"], 0, "I = Prt = 2000 × 0.05 × 3 = $300.", {"$100": "That's only 1 year of interest.", "$315.25": "That's compound interest. Simple interest is just P × r × t.", "$3,000": "The rate is wrong. 5% is 0.05, so 2,000 × 0.05 × 3 = 300."}],
["Essential Skills", "$1,000 is invested at 10% interest compounded annually. How much is it worth after 2 years?", ["$1,210", "$1,200", "$1,100", "$1,020"], 0, "1000 × 1.1² = 1000 × 1.21 = $1,210.", {"$1,200": "That's simple interest. Compound interest also earns interest on the first year's $100.", "$1,100": "That's only 1 year.", "$1,020": "This uses 1% a year. The rate is 10%."}],
["Essential Skills", "A stadium seats 68,500 fans and is 92% full. How many fans are there?", ["63,020", "62,000", "68,408", "5,480"], 0, "68,500 × 0.92 = 63,020.", {"62,000": "This is a rough guess. Compute exactly: 68,500 × 0.92.", "68,408": "This subtracts 92 people. 92% is a percent of the seats, not a count.", "5,480": "That's the 8% of seats that are empty."}],
["Essential Skills", "Average attendance drops from 25,000 to 21,000. What is the percent decrease?", ["16%", "4%", "19%", "84%"], 0, "(25,000 − 21,000)/25,000 = 4,000/25,000 = 0.16 = 16%.", {"4%": "That's the drop in thousands (4,000). Divide it by the original: 4,000 ÷ 25,000.", "19%": "This divides by the new value, 21,000. Percent change divides by the original.", "84%": "That's how much attendance is left (21/25), not how much it dropped."}]

/* ---- weekly goal & activity tracking (stored on this device) ---- */
const GOAL={days:7,cards:100,sets:3,acc:70,reward:25,dayMin:20};
const AKEY="act-activity-v1";

const asave=()=>{try{localStorage.setItem(AKEY,JSON.stringify(act))}catch(e){}};
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
let lastTick=0;
function logAct(type,ok){
  const now=Date.now(),k=dkey(now);const d=act[k]||(act[k]={cards:0,vq:0,vqc:0,m:0,mc:0,sets:0,ms:0});
  if(lastTick&&now-lastTick<15*60000)d.ms+=Math.min(now-lastTick,90000);lastTick=now;
  if(type==="card")d.cards++;
  else if(type==="vq"){d.vq++;if(ok)d.vqc++}
  else if(type==="m"){d.m++;if(ok)d.mc++}
  else if(type==="set")d.sets++;
  else if(type==="e"){d.e=(d.e||0)+1;if(ok)d.ec=(d.ec||0)+1}
  asave();scheduleSync();
}
/* ---- auto-sync to Dad's dashboard (Netlify function) ---- */
const SYNC_URL="/api/progress",SYNC_TOKEN="yoseph-act-sync-v1";

  try{fetch(SYNC_URL,{method:"POST",keepalive:!!keep,headers:{"content-type":"application/json","x-sync-token":SYNC_TOKEN},body:JSON.stringify(snapshot())})
    .then(r=>{if(r.ok){lastSync=Date.now();syncState="ok";try{localStorage.setItem("act-last-sync",String(lastSync))}catch(e){}}else syncState="err"})

function syncLine(){if(!lastSync)return "Your progress is shared with Dad automatically after you study.";

const items=d=>d?d.cards+d.vq+d.m+(d.e||0):0;
function weekStats(start){
  const s={days:0,cards:0,sets:0,m:0,mc:0,vq:0,vqc:0,ms:0,dayOn:[]};
  for(let i=0;i<7;i++){const t=new Date(start);t.setDate(t.getDate()+i);const d=act[dkey(t)];
    const on=items(d)>=GOAL.dayMin;s.dayOn.push(on);if(on)s.days++;
